  { id: "m-kyocera", f: "arch", s: "kyocera", q: "京都市京セラ美術館は、昭和天皇の即位を記念して建てられた。開館したときの名は？", c: ["大礼記念京都美術館", "京都府立美術館", "平安記念美術館", "京都帝室美術館"], e: "1933年開館。2020年の改修でいまの名に。" },
  { id: "m-momak", f: "arch", s: "kyocera", q: "岡崎にある京都国立近代美術館の今の建物を設計したのは？", c: ["槇文彦", "谷口吉生", "黒川紀章", "丹下健三"], e: "1986年完成。京都市京セラ美術館と向かい合って建つ。" },
  { id: "m-bunpaku", f: "arch", s: "bunpaku", q: "京都文化博物館の別館は、もとは何の建物？", c: ["日本銀行京都支店", "京都府庁", "中京郵便局", "京都電燈本社"], e: "辰野金吾らの設計で1906年完成。赤煉瓦に白い帯の「辰野式」。" },
  { id: "m-tetsudo", f: "arch", s: "umekoji", q: "京都鉄道博物館の扇形車庫に並んでいるのは？", c: ["蒸気機関車", "路面電車", "新幹線", "トロリーバス"], e: "1914年完成の梅小路機関車庫。転車台で向きを変えて出入りする。" },
  { id: "m-gakko", f: "arch", s: "kaichi", q: "旧開智小学校の跡にあり、番組小学校の歴史を伝える博物館は？", c: ["京都市学校歴史博物館", "京都国際マンガミュージアム", "京都市考古資料館", "京都文化博物館"], e: "明治2年、町衆が自ら建てた番組小学校の資料を集める。" },
  { id: "m-manga", f: "arch", q: "旧龍池小学校の校舎を生かした、マンガの博物館は？", c: ["京都国際マンガミュージアム", "京都市学校歴史博物館", "京都文化博物館", "京都市京セラ美術館"], e: "2006年開館。烏丸御池の近く。" },
  { id: "m-kokogaku", f: "arch", s: "kokogaku", q: "西陣にある京都市考古資料館の建物は、もとは何？", c: ["西陣織物館", "西陣小学校", "西陣郵便局", "銀行の支店"], e: "1914年、本野精吾の設計。" },
  { id: "m-raku", f: "craft", q: "樂家の隣にあり、歴代の樂焼の茶碗を伝える美術館は？", c: ["樂美術館", "細見美術館", "泉屋博古館", "何必館"], e: "上京区油小路一条。樂家は長次郎から続く。" },
  { id: "m-oyamazaki", f: "arch", q: "実業家・加賀正太郎の山荘を生かし、モネの「睡蓮」などを展示する美術館がある町は？", c: ["大山崎町", "宇治田原町", "精華町", "京丹波町"], e: "アサヒグループ大山崎山荘美術館。安藤忠雄の設計で新館が加わった。" },
  { id: "m-shotenkaku", f: "arch", q: "伊藤若冲の障壁画など、相国寺・金閣寺・銀閣寺の寺宝を展示する美術館は？", c: ["承天閣美術館", "細見美術館", "樂美術館", "泉屋博古館"], e: "相国寺の境内にある。" },
  { id: "m-senoku", f: "arch", q: "住友家が集めた中国古代の青銅器で知られる、鹿ケ谷の美術館は？", c: ["泉屋博古館", "細見美術館", "承天閣美術館", "藤井斉成会有鄰館"], e: "住友家の別邸の地に建つ。" },
  { id: "y-seishinin", f: "life", q: "和泉式部が初代住職とされ、その墓と伝わる宝篋印塔がある新京極の寺は？", c: ["誠心院", "誓願寺", "蛸薬師堂", "錦天満宮"], e: "「和泉式部寺」とも呼ばれる。" },
);
// 2026年の2級公開テーマ「豊臣家と京都」（秀吉と弟・秀長の足跡）
KQ.push(
  { id: "tt-gyoko", f: "history", q: "1588年、豊臣秀吉が完成したばかりの聚楽第に迎えた天皇は？", c: ["後陽成天皇", "正親町天皇", "後水尾天皇", "後奈良天皇"], e: "諸大名に天皇と秀吉への忠誠を誓わせた。正親町天皇は秀吉の関白就任のときの天皇。" },
  { id: "tt-hidetsugu", f: "history", q: "秀吉から関白と聚楽第を譲られ、のちに切腹を命じられた甥は？", c: ["豊臣秀次", "豊臣秀長", "豊臣秀勝", "小早川秀秋"], e: "1595年。聚楽第はその後まもなく取り壊され、建物は各地に移されたと伝わる。" },
  { id: "tt-karamon-d", f: "temple", s: "daitokuji", q: "聚楽第の遺構と伝わる、国宝の唐門がある寺は？", c: ["大徳寺", "妙心寺", "南禅寺", "知恩院"], e: "大徳寺の唐門。豊国神社や西本願寺の唐門は、伏見城の遺構と伝わる。" },
  { id: "tt-odoi-km", f: "history", s: "odoi", q: "秀吉が1591年に築いた御土居の総延長は、およそ何km？", c: ["約22.5km", "約12km", "約35km", "約50km"], e: "北は鷹峯、南は九条、東は鴨川、西は紙屋川のあたりまでを囲んだ。" },
  { id: "tt-nanakuchi", f: "street", s: "odoi", q: "御土居の出入り口を、まとめて何と呼ぶ？", c: ["京の七口", "京の九門", "洛中五口", "十二口"], e: "鞍馬口・丹波口・粟田口など、今も地名に残る。実際の口の数は時代によって異なる。九門は京都御苑の門。" },
  { id: "tt-teramachi", f: "street", q: "秀吉が洛中の寺院を集め、都の東の端に寺を並べて作った通りは？", c: ["寺町通", "寺之内通", "新京極通", "河原町通"], e: "寺之内も北の端に寺を集めた地区。新京極は明治に寺町の境内を開いてできた繁華街。" },
  { id: "tt-daibutsu", f: "temple", q: "秀吉が奈良の東大寺にならって大仏殿を建てた寺は？", c: ["方広寺", "妙法院", "智積院", "蓮華王院"], e: "1595年に完成したが、翌年の慶長伏見地震で大仏が壊れた。大仏殿の石垣が今も残る。" },
  { id: "tt-shomei", f: "history", q: "1614年、徳川家康が方広寺の鐘の銘文のどの言葉を問題にした？", c: ["国家安康", "天下布武", "厭離穢土", "一期一会"], e: "「家康」の名を分断し、豊臣を君とする（君臣豊楽）呪いだと難癖をつけ、大坂の陣のきっかけになった。鐘は今も方広寺に残る。" },
  { id: "tt-amidagamine", f: "history", q: "秀吉の墓所「豊国廟」がある東山の峰は？", c: ["阿弥陀ヶ峰", "華頂山", "音羽山", "如意ヶ岳"], e: "豊国神社の東にあり、長い石段の上に五輪塔が立つ。音羽山は清水寺の山号、如意ヶ岳は大文字の山。" },
  { id: "tt-karamon-h", f: "temple", q: "豊国神社の国宝の唐門は、どこの遺構と伝わる？", c: ["伏見城", "聚楽第", "大坂城", "淀城"], e: "二条城、南禅寺金地院を経て、明治に豊国神社へ移されたと伝わる。" },
  { id: "tt-sanboin", f: "arch", s: "daigoji", q: "醍醐の花見に合わせて、秀吉が自ら基本の設計をしたとされる庭は？", c: ["醍醐寺三宝院の庭", "天龍寺の曹源池庭園", "金地院の鶴亀の庭", "大仙院の庭"], e: "聚楽第から運んだ名石「藤戸石」が据えられている。" },
  { id: "tt-entokuin", f: "temple", s: "kodaiji", q: "北政所（ねね）が晩年を過ごし、今は高台寺の塔頭になっている寺は？", c: ["圓徳院", "月真院", "養源院", "寿聖院"], e: "伏見城の化粧御殿の前庭を移したと伝わる庭がある。養源院は淀殿が建てた寺。" },
  { id: "tt-sanjo", f: "street", s: "sanjo-ohashi", q: "1590年、秀吉の命で石の柱の橋に架け替えられた橋は？", c: ["三条大橋", "五条大橋", "四条大橋", "渡月橋"], e: "奉行は増田長盛。今も擬宝珠に「天正十八年」の銘が残り、東海道の終点となった。" },
  { id: "tt-gojo", f: "street", q: "秀吉が方広寺の大仏への道筋として、今の場所に移した橋は？", c: ["五条大橋", "三条大橋", "七条大橋", "松原橋"], e: "もとの五条大橋は今の松原通（旧五条通）にあった。牛若丸と弁慶の出会いの場もこの旧五条の橋とされる。" },
  { id: "tt-honganji", f: "temple", s: "nishihonganji", q: "1591年、秀吉が堀川七条に寺地を与えて大坂の天満から移らせた寺は？", c: ["本願寺（今の西本願寺）", "知恩院", "仏光寺", "興正寺"], e: "のち1602年に徳川家康が教如に寺地を与え、東本願寺ができた。" },
  { id: "tt-sokenin", f: "temple", s: "daitokuji", q: "秀吉が織田信長の葬儀を行い、その菩提を弔うために大徳寺に建てた塔頭は？", c: ["総見院", "大光院", "黄梅院", "聚光院"], e: "1582年。大光院は秀長の菩提寺、黄梅院は信長が父のために建てた寺、聚光院は三好家ゆかり。" },
  { id: "tt-hidenaga", f: "temple", s: "daitokuji", q: "秀吉の弟・秀長の菩提寺で、大和郡山から大徳寺の中に移されたのは？", c: ["大光院", "総見院", "三玄院", "龍源院"], e: "秀長は1591年に大和郡山で亡くなった。2026年の公開テーマでは秀長の足跡も出題範囲。" },
  { id: "tt-shounji", f: "temple", q: "秀吉が幼くして亡くなった子・鶴松のために建てた祥雲寺の跡に、今あるのは？", c: ["智積院", "妙法院", "養源院", "方広寺"], e: "長谷川等伯一門の障壁画「楓図」「桜図」は、もとは祥雲寺のために描かれた。" },
  { id: "tt-yodojo", f: "history", q: "秀吉が淀殿のために修築し、鶴松が生まれた城は？", c: ["淀城", "伏見城", "聚楽第", "勝竜寺城"], e: "1589年。淀殿の名はこの城にちなむ。今の淀城跡は江戸時代に築き直された別の城。" },
  { id: "tt-zuisenji", f: "temple", q: "豊臣秀次とその一族の菩提を弔う、三条木屋町の寺は？", c: ["瑞泉寺", "誓願寺", "本能寺", "天性寺"], e: "1611年、高瀬川を開いた角倉了以が建てた。秀次の一族は三条河原で処刑された。" },
  { id: "tt-jodoin", f: "temple", s: "kitano", q: "北野大茶湯で秀吉が湯を所望したことから「湯たく山茶くれん寺」と呼ばれる寺は？", c: ["浄土院", "大報恩寺", "東向観音寺", "引接寺"], e: "北野天満宮の近くにある。大報恩寺は千本釈迦堂、引接寺は千本ゑんま堂。" },
  { id: "tt-taikoi", f: "temple", s: "kitano", q: "北野大茶湯の茶に使われたと伝わる、北野天満宮の境内の井戸は？", c: ["太閤井戸", "染井", "醒ヶ井", "音羽の滝"], e: "染井（梨木神社）と醒ヶ井は「京の名水」に数えられる別の水。" },
  { id: "tt-kanpaku", f: "history", q: "秀吉が関白になった年は？", c: ["1585年", "1582年", "1590年", "1598年"], e: "翌1586年に太政大臣となり、豊臣の姓を受けた。1582年は本能寺の変、1590年は天下統一、1598年は秀吉の死。" },
  { id: "tt-shigetsu", f: "history", q: "1596年の慶長伏見地震で倒れ、木幡山に建て直された秀吉の城は？", c: ["指月の伏見城", "聚楽第", "淀城", "二条城"], e: "秀吉は1598年、木幡山の伏見城で亡くなった。" },
  { id: "tt-toji", f: "temple", s: "toji", q: "1603年、豊臣秀頼が再建した東寺の建物は？", c: ["金堂", "五重塔", "講堂", "御影堂"], e: "本尊は薬師如来。五重塔は1644年、徳川家光の寄進による再建。" },
  { id: "tt-ogon", f: "history", q: "1586年、秀吉が黄金の茶室を運び込んで正親町天皇に茶を献じた場所は？", c: ["御所（小御所）", "聚楽第", "北野天満宮", "大坂城"], e: "組み立て式の茶室で、のちに北野大茶湯でも披露された。" },
);
// 過去問（第27回・2025年 2級）で問われた事実をもとにした自作問題。解説は誤りの選択肢まで
KQ.push(
  { id: "p27-hebizuka", f: "history", q: "太秦に残る、秦氏の首長の墓とされる横穴式石室の古墳は？", c: ["蛇塚古墳", "天塚古墳", "私市円山古墳", "作山古墳"], e: "蛇塚古墳は石室の石がむき出しになった府内最大級の横穴式石室。天塚古墳も太秦の古墳だが前方後円墳で、規模は蛇塚に及ばない。私市円山古墳（綾部市）は府内最大の円墳、作山古墳は与謝野町の古墳群。" },
  { id: "p27-nijooji", f: "history", q: "平安京の大内裏の南、朱雀門の前を東西に通り、貴族の邸宅が並んだ大路は？", c: ["二条大路", "一条大路", "三条大路", "七条大路"], e: "朱雀門は二条大路に面していた。一条大路は大内裏の北の端、三条大路はその南、七条大路の近くには東西の市が置かれた。" },
  { id: "p27-kebiishi", f: "history", q: "平安時代、京の治安を守るために置かれ、のちに裁判まで扱った令外官は？", c: ["検非違使", "京職", "蔵人所", "弾正台"], e: "検非違使は令外官。京職は律令に定められた京の行政機関で、検非違使に役目を奪われた。蔵人所は天皇の秘書役の令外官。弾正台は律令の監察機関。" },
  { id: "p27-itakura", f: "history", s: "nijojo", q: "1601年に始まった二条城の造営で、総奉行を務めたのは？", c: ["板倉勝重", "片桐且元", "加藤清正", "藤堂高虎"], e: "板倉勝重は初代の京都所司代でもある。片桐且元は豊臣家の家老で、方広寺の鐘銘事件の交渉役。加藤清正は熊本城、藤堂高虎は築城の名手として知られるが、総奉行ではない。" },
  { id: "p27-rakushisha", f: "craft", q: "松尾芭蕉の門人・向井去来の庵で、芭蕉がここで『嵯峨日記』を書いたのは？", c: ["落柿舎", "西行庵", "芭蕉庵", "去来塚庵"], e: "嵯峨野の落柿舎。名は一夜で柿の実が落ちたことから。西行庵は円山公園の東にある西行ゆかりの庵、芭蕉庵は一乗寺の金福寺にあり、蕪村らが再興した。" },
  { id: "p27-umeda", f: "history", q: "烏丸御池のあたりに住み、尊王攘夷を唱えて安政の大獄で最初に捕らえられた儒学者は？", c: ["梅田雲浜", "頼三樹三郎", "竹内式部", "高山彦九郎"], e: "梅田雲浜は小浜藩士出身。頼三樹三郎は頼山陽の子で、安政の大獄で処刑された。竹内式部は江戸中期の宝暦事件、高山彦九郎は三条大橋のたもとに土下座像がある江戸後期の尊王家。" },
  { id: "p27-maizuru", f: "street", q: "明治に日本海側でただ一つの海軍の鎮守府が置かれ、赤れんが倉庫群が残るのは？", c: ["舞鶴市", "宮津市", "京丹後市", "福知山市"], e: "舞鶴の赤れんがパークの倉庫群は重要文化財。宮津は天橋立と城下町、京丹後は丹後ちりめん、福知山は明智光秀が築いた城下町で知られる。" },
  { id: "p27-nyakuichi", f: "temple", q: "平清盛が植えたと伝わる楠の大木が道の真ん中に残る、西大路八条の神社は？", c: ["若一神社", "新熊野神社", "六孫王神社", "厳島神社"], e: "若一神社は清盛の西八条殿の跡とされ、開運出世の神。新熊野神社は後白河上皇が熊野から勧請し、大樟がある。六孫王神社は清和源氏の祖・源経基を祀る。厳島神社（京都御苑）は清盛が母のために宮島から勧請したと伝わる。" },
  { id: "p27-sugawarain", f: "temple", q: "「烏丸の天神さん」と呼ばれ、菅原道真の産湯の井戸がある神社は？", c: ["菅原院天満宮神社", "文子天満宮", "菅大臣神社", "吉祥院天満宮"], e: "道真の生誕地の一つとされる。文子天満宮は道真の乳母・多治比文子が祀った天神信仰の発祥地。菅大臣神社は道真の邸宅跡で、紅梅殿・白梅殿の旧跡。吉祥院天満宮も生誕地を名乗り、へその緒の伝えがある。" },
  { id: "p27-takio", f: "temple", q: "大丸の創業家・下村家が崇敬し、拝殿の天井に長さ約8mの木彫りの龍がある東山区の神社は？", c: ["瀧尾神社", "新日吉神宮", "若宮八幡宮", "豊国神社"], e: "瀧尾神社の龍は夜に動き出すという話がある。新日吉神宮は後白河上皇が日吉社を勧請した神社。若宮八幡宮は陶器の神で、五条坂の陶器まつりで知られる。豊国神社は秀吉を祀る。" },
  { id: "p27-uji", f: "temple", q: "宇治神社と宇治上神社に祀られる、応神天皇の皇子は？", c: ["菟道稚郎子", "大山守皇子", "仁徳天皇", "市辺押磐皇子"], e: "菟道稚郎子は兄の大鷦鷯尊（のちの仁徳天皇）に皇位を譲ったと伝わる。大山守皇子は皇位を狙って討たれた兄。市辺押磐皇子は履中天皇の皇子で別の人物。" },
  { id: "p27-hojuji", f: "temple", s: "sanjusangendo", q: "後白河法皇の御所の跡にあり、親鸞自作と伝わる「そば喰いの御像」がある寺は？", c: ["法住寺", "妙法院", "養源院", "智積院"], e: "法住寺は後白河法皇の法住寺殿の跡で、法皇の御陵もすぐそば。妙法院は天台宗の門跡で、三十三間堂を管理する。養源院は淀殿、智積院は秀吉の子・鶴松ゆかり。" },
  { id: "p27-shiun", f: "temple", q: "黒谷の西雲院にある、法然が腰を掛けて念仏したとき紫の雲がたなびいたという石は？", c: ["紫雲石", "瓜生石", "影向石", "弁慶石"], e: "西雲院は金戒光明寺（黒谷）の塔頭。瓜生石は知恩院の門前にある七不思議のひとつ。弁慶石は三条通麩屋町にある、弁慶ゆかりと伝わる石。" },
  { id: "p27-konzoji", f: "temple", q: "徳川綱吉の母・桂昌院が再建し、明治に愛宕山から勝軍地蔵が移された西山の寺は？", c: ["金蔵寺", "金福寺", "金光寺", "金地院"], e: "金蔵寺は西京区の西山にある。金福寺は一乗寺の芭蕉庵の寺、金地院は南禅寺の塔頭で以心崇伝ゆかり。名前の似た寺を見分ける問題はよく出る。" },
  { id: "p27-tenkyuin", f: "arch", q: "妙心寺の塔頭で、狩野山楽・山雪の筆と伝わる金碧の方丈障壁画が残るのは？", c: ["天球院", "退蔵院", "桂春院", "大法院"], e: "天球院は江戸初期の創建で、方丈の障壁画が重要文化財。退蔵院は如拙の国宝「瓢鮎図」と枯山水の庭、桂春院は四つの庭、大法院は露地庭と紅葉で知られる。" },
  { id: "p27-daibutsuyo", f: "arch", q: "京都では珍しい大仏様を取り入れた、国宝の三門がある寺は？", c: ["東福寺", "南禅寺", "知恩院", "大徳寺"], e: "東福寺三門は室町時代の禅宗寺院の三門として最古。南禅寺三門は江戸初期、知恩院三門は1621年の建立。大徳寺の山門は利休の像で知られる「金毛閣」。" },
  { id: "p27-ryoginan", f: "arch", q: "14世紀末に建てられ、現存最古の方丈建築とされる国宝の方丈は？", c: ["東福寺龍吟庵方丈", "南禅寺方丈", "大徳寺方丈", "妙心寺方丈"], e: "龍吟庵は東福寺の開山・円爾の弟子が住した塔頭。重森三玲の作った三つの庭もある。南禅寺方丈は御所の建物を移したと伝わる大方丈と小方丈の国宝、大徳寺方丈は江戸初期。" },
  { id: "p27-butokuden", f: "arch", q: "平安遷都千百年紀念事業として建てられ、松室重光が設計した、今も武道に使われる建物は？", c: ["旧武徳殿", "平安神宮", "京都府庁旧本館", "京都市武道センター"], e: "1899年の建築で重要文化財。平安神宮は伊東忠太・木子清敬らの設計。京都府庁旧本館も松室重光の設計だが、こちらは役所の建物。" },
  { id: "p27-honpoji", f: "arch", q: "本阿弥光悦の作と伝わる、三つの巴をかたどった「巴の庭」がある寺は？", c: ["本法寺", "本隆寺", "妙覚寺", "光悦寺"], e: "本法寺は本阿弥家の菩提寺で、長谷川等伯の大涅槃図も伝わる。光悦寺は鷹峯の光悦の旧居で、光悦垣で知られる。本隆寺・妙覚寺も同じ西陣の日蓮宗の寺。" },
  { id: "p27-entsuji", f: "arch", q: "後水尾天皇の幡枝御所だった円通寺の枯山水が借景にしている山は？", c: ["比叡山", "小倉山", "如意ヶ岳", "愛宕山"], e: "円通寺の庭は生け垣の向こうに比叡山を望む、借景庭園の代表。小倉山は嵐山の対岸、如意ヶ岳は大文字山、愛宕山は京都の北西の高峰。" },
  { id: "p27-hangesho", f: "arch", q: "建仁寺の塔頭・両足院の庭で、初夏に葉の一部が白くなるのは？", c: ["半夏生", "カキツバタ", "沙羅双樹", "アジサイ"], e: "半夏生は7月初めの「半夏生」のころに見ごろ。カキツバタは大田神社、アジサイは三室戸寺、沙羅双樹（ナツツバキ）は妙心寺東林院で知られる。" },
  { id: "p27-goshun", f: "arch", q: "与謝蕪村に俳諧と絵を学び、のちに円山応挙の影響を受けて四条派を開いた画家は？", c: ["松村呉春", "岸駒", "原在中", "長沢芦雪"], e: "四条派の名は呉春が四条に住んだことから。岸駒は岸派、原在中は原派の祖。長沢芦雪は応挙の弟子で、奔放な画風で知られる。" },
  { id: "p27-sanpitsu", f: "craft", q: "本阿弥光悦・松花堂昭乗とともに「寛永の三筆」と呼ばれるのは？", c: ["近衛信尹", "尊円法親王", "小野道風", "藤原行成"], e: "近衛信尹は書の「三藐院流」の祖。尊円法親王は青蓮院流（御家流）の祖。小野道風・藤原行成は平安中期の「三跡」。" },
  { id: "p27-seiryoji", f: "temple", q: "奝然が宋から持ち帰り、胎内に絹の五臓が納められていた清凉寺の本尊は？", c: ["釈迦如来立像", "阿弥陀如来坐像", "薬師如来立像", "千手観音坐像"], e: "清凉寺式釈迦如来と呼ばれ、国宝。インドから中国へ伝わった生身の釈迦の姿を写したとされる。清凉寺は「嵯峨釈迦堂」とも呼ばれる。" },
  { id: "p27-shippo", f: "craft", q: "明治の並河靖之が海外の博覧会で賞を受けた、金属にガラス質の釉薬を焼き付ける工芸は？", c: ["京七宝", "京象嵌", "京漆器", "京焼"], e: "並河靖之の旧宅は並河靖之七宝記念館として公開されている。京象嵌は金属に別の金属をはめ込む技、京漆器は漆を塗り重ねる工芸。" },
  { id: "p27-komon", f: "craft", q: "友禅と同じ型染めの技法で、一色で型を置いて防染糊を引き、地を染める伝統工芸品は？", c: ["京小紋", "京鹿の子絞", "京黒紋付染", "京友禅"], e: "京小紋は細かい文様を一色で染める。京鹿の子絞は布をくくって染める絞り、京黒紋付染は黒の紋付を染める技。京友禅は多色の手描き・型染め。" },
  { id: "p27-koshikibu", f: "craft", q: "「大江山 いくのの道の 遠ければ まだふみもみず 天の橋立」と詠んだ、和泉式部の娘は？", c: ["小式部内侍", "紫式部", "伊勢大輔", "赤染衛門"], e: "歌合の前に「母に代作を頼んだのでは」とからかわれて即座に返した歌と伝わる。伊勢大輔は「いにしへの奈良の都の八重桜」、赤染衛門は「やすらはで」の歌で知られる。" },
  { id: "p27-yuin", f: "craft", q: "千宗旦が再度隠居したときに建てたと伝わる、裏千家の代表的な四畳半の茶室は？", c: ["又隠", "今日庵", "燕庵", "残月亭"], e: "今日庵は宗旦の一畳台目の茶室で、裏千家の別名にもなった。燕庵は藪内家、残月亭は表千家の茶室。" },
  { id: "p27-kashin", f: "craft", q: "江戸後期に煎茶の点前や作法を考え、煎茶道の家元の先がけとなった茶人は？", c: ["小川可進", "売茶翁（高遊外）", "永谷宗円", "金森宗和"], e: "小川可進は小川流煎茶の祖。売茶翁は茶を売り歩いて煎茶を広めた禅僧、永谷宗円は宇治で青製煎茶法を考えた人。金森宗和は抹茶の「姫宗和」と呼ばれた茶人。" },
  { id: "p27-shino", f: "craft", q: "香道で、武家の志野宗信を祖とする流派は？", c: ["志野流", "御家流", "嵯峨御流", "未生流"], e: "志野流は武家の香道。御家流は公家の三条西実隆を祖とする香道。嵯峨御流と未生流はいけばなの流派。" },
  { id: "p27-yuzaki", f: "craft", q: "観阿弥・世阿弥の親子が出た大和猿楽の座は？", c: ["結崎座", "坂戸座", "円満井座", "外山座"], e: "結崎座はのちの観世流。坂戸座は金剛流、円満井座は金春流、外山座は宝生流のもと。" },
  { id: "p27-kantei", f: "craft", q: "南座の顔見世のまねき看板に使われる書体は？", c: ["勘亭流", "相撲字", "寄席文字", "御家流"], e: "勘亭流は歌舞伎の看板の文字。相撲字は番付、寄席文字は寄席のめくりに使う。御家流は江戸時代の公文書の書風。" },
  { id: "p27-ikimi", f: "craft", q: "『菅原伝授手習鑑』の武部源蔵ゆかりとされ、歌舞伎役者の参拝がある南丹市の神社は？", c: ["生身天満宮", "文子天満宮", "長岡天満宮", "吉祥院天満宮"], e: "生身天満宮は道真の生前から祀ったとされ、日本最古の天満宮を名乗る。文子・長岡・吉祥院も道真ゆかりだが、源蔵とは結びつかない。" },
  { id: "p27-tenryuji-setsubun", f: "festival", q: "節分会に境内の塔頭を巡って七福神のお札を集める「七福神めぐり」がある寺は？", c: ["天龍寺", "廬山寺", "吉田神社", "壬生寺"], e: "天龍寺の節分会。廬山寺は鬼法楽、吉田神社は追儺式と火炉祭、壬生寺は節分の炮烙奉納で知られる。" },
  { id: "p27-godairiki", f: "festival", q: "2月28日に五大力菩薩を開帳する、聖護院の近くの本山修験宗の寺は？", c: ["積善院準提堂", "醍醐寺", "聖護院", "三室戸寺"], e: "積善院準提堂の「五大力さん」。醍醐寺の五大力尊仁王会は2月23日で、大きな鏡餅を持ち上げる餅上げ力奉納がある。" },
  { id: "p27-nehan", f: "festival", q: "江戸時代の画僧・明誉古礀による日本最大級の涅槃図を3月に掲げる寺は？", c: ["泉涌寺", "東福寺", "本法寺", "真如堂"], e: "泉涌寺の大涅槃図。東福寺の大涅槃図は室町の明兆の筆で、猫が描かれていることで知られる。本法寺は長谷川等伯、真如堂も涅槃図を掲げる。画僧の名で見分けたい。" },
  { id: "p27-hotokemai", f: "festival", q: "5月8日、舞鶴市の松尾寺で仏の面をつけて雅楽に合わせて舞う、国の重要無形民俗文化財は？", c: ["仏舞", "田楽", "練り供養", "やすらい花"], e: "仏舞は釈迦・大日・阿弥陀の面をつけた6人が舞う。田楽は田植えの芸能、練り供養は菩薩の面をつけて歩く行事（即成院など）、やすらい花は今宮神社などの鎮花祭。" },
  { id: "p27-kuze", f: "festival", q: "祇園祭で「久世駒形稚児」を出し、7月13日に稚児が社参する南区の神社は？", c: ["綾戸國中神社", "御香宮神社", "八大神社", "悪王子社"], e: "駒形稚児は素戔嗚尊の荒御魂とされる駒頭を胸につけ、神幸祭・還幸祭で中御座の神輿を先導する。悪王子社は八坂神社の末社。" },
  { id: "p27-koyamaki", f: "festival", q: "六道珍皇寺の六道まいりで、精霊の依代として買い求めるものは？", c: ["高野槇", "樒", "榊", "蓮の葉"], e: "高野槇に精霊を乗せて家へ連れ帰るとされる。樒は仏前・墓前に供える木、榊は神事に使う木。" },
  { id: "p27-myo", f: "festival", q: "五山送り火で、松ヶ崎の西山に灯るのは？", c: ["「妙」", "「法」", "舟形", "左大文字"], e: "「妙」は西山、「法」は東山。舟形は西賀茂、左大文字は金閣寺の北の大北山。" },
  { id: "p27-garasha", f: "festival", q: "明智光秀の娘・玉（ガラシャ）が細川忠興に嫁いだ様子を再現する「ガラシャ祭」があるのは？", c: ["長岡京市", "亀岡市", "福知山市", "宮津市"], e: "勝竜寺城は長岡京市。亀岡は光秀の丹波亀山城、福知山は光秀が築いた城下町、宮津は細川家が治めた城下町。" },
  { id: "p27-honeshogatsu", f: "food", q: "1月20日の「骨正月」に、正月の鰤のアラと煮て食べるとされる野菜は？", c: ["大根", "小芋", "金時人参", "牛蒡"], e: "二十日正月とも。正月用の魚を骨まで使い切る。小芋・金時人参・牛蒡は正月の煮しめに入る野菜。" },
  { id: "p27-zuiki", f: "food", q: "夏のおばんざい「ずいきの炊いたん」のずいきは、何の葉柄？", c: ["里芋", "蕗", "山芋", "さつま芋"], e: "ずいきは里芋の茎。北野天満宮のずいき祭では、ずいきで屋根を葺いた神輿が出る。蕗は茎そのものを食べる別の野菜。" },
  { id: "p27-horagai", f: "food", q: "聖護院の節分の護摩の供え物にもなる、厄除けの京菓子は？", c: ["法螺貝餅", "行者餅", "はなびら餅", "水無月"], e: "法螺貝餅は山伏の法螺貝をかたどった菓子。行者餅は7月の祇園祭の宵山のころだけ、はなびら餅は正月、水無月は6月30日の菓子。" },
  { id: "p27-rokugatsu", f: "life", q: "習い事を始めるとよいとされ、いけばなの日・楽器の日にもなっている日は？", c: ["6月6日", "3月3日", "5月5日", "1月11日"], e: "「6歳の6月6日」に稽古を始めるとよいというならわしから。" },
  { id: "p27-otame", f: "life", q: "お祝いをもらったとき、その1割ほどを半紙とともにすぐ返すならわしは？", c: ["おため", "お移り", "内祝", "お返し"], e: "「慶びが移りますように」という意味をこめる。お移りは贈り物の器に半紙やマッチを入れて返すこと、内祝はのちに改めて品物を贈ること。" },
  { id: "p27-yasukenai", f: "life", q: "京ことばで「品がない」ことを何という？", c: ["ヤスケナイ", "ハンナリ", "コートナ", "ヤクタイ"], e: "ハンナリは明るく上品、コートナは地味で上品。ヤクタイは「めちゃくちゃ」「だめ」の意味。" },
  { id: "p27-yanagi", f: "life", q: "六角堂で、嵯峨天皇が夢のお告げで妃を迎えたことから縁結びのご利益があるとされる木は？", c: ["柳", "梅", "桜", "松"], e: "六角堂の「六角柳」。縁結びの柳として、おみくじを結ぶ人が多い。" },
  { id: "p27-inabado", f: "life", q: "因幡の国から薬師如来が空を飛んで藤原行平の屋敷に来たという伝説がある寺は？", c: ["平等寺（因幡堂）", "清凉寺", "高山寺", "六波羅蜜寺"], e: "平等寺は烏丸松原にあり「因幡薬師」と呼ばれる。清凉寺の本尊は宋から来た釈迦如来。" },
  { id: "p27-ominaeshi", f: "street", q: "小野頼風と京の女の悲恋を描いた謡曲にちなむ、八幡市の松花堂庭園のあたりの地名は？", c: ["女郎花", "物集女", "女布", "内里"], e: "謡曲「女郎花」。女郎花塚と頼風塚が残る。物集女は向日市の地名。" },
  { id: "p27-kaya", f: "street", q: "丹後ちりめんで栄え、「ちりめん街道」の名で知られる重要伝統的建造物群保存地区は？", c: ["与謝野町加悦", "伊根浦", "美山町北", "上賀茂"], e: "伊根浦は舟屋、美山町北はかやぶき、上賀茂は社家町の伝建地区。" },
  { id: "p27-tateiwa", f: "street", q: "丹後半島の竹野川河口にある、高さ約20mの巨大な一枚岩は？", c: ["立岩", "屏風岩", "経ヶ岬", "琴引浜"], e: "立岩は麻呂子親王の鬼退治の伝説がある。屏風岩は京丹後市の海の奇岩、経ヶ岬は灯台がある丹後半島の先端、琴引浜は鳴き砂の浜。" },
  { id: "p27-chimakizasa", f: "street", q: "左京区の花脊などに自生し、祇園祭の粽に使われる植物は？", c: ["チマキザサ", "フタバアオイ", "オケラ", "ハンゲショウ"], e: "粽は笹の葉で作る。フタバアオイは葵祭、オケラは八坂神社のをけら詣りに使う。" },
  { id: "p27-harahiroshi", f: "arch", s: "kyotostation", q: "今の京都駅ビルを設計した建築家は？", c: ["原広司", "安藤忠雄", "黒川紀章", "丹下健三"], e: "1997年の完成。大きな吹き抜けと大階段が特徴。" },
  { id: "p27-tango", f: "street", q: "「丹後くろまつ号」などの観光列車を走らせている鉄道は？", c: ["京都丹後鉄道", "嵯峨野観光鉄道", "叡山電鉄", "京阪電鉄"], e: "嵯峨野観光鉄道はトロッコ列車、叡山電鉄は展望列車「きらら」や「ひえい」を走らせる。" },
  { id: "p27-teikan", f: "arch", s: "kyocera", q: "京都市京セラ美術館の本館のように、洋風の建物に和風の屋根をのせた様式は？", c: ["帝冠様式", "セセッション", "コロニアル様式", "擬洋風"], e: "1933年の建築で、現存する公立美術館の建物として最古。擬洋風は明治初めに大工が洋風をまねた建物。" },
  { id: "p27-kamashi", f: "craft", q: "大西清右衛門美術館の大西家は、千家十職のうち何の家？", c: ["釜師", "指物師", "塗師", "表具師"], e: "千家十職：茶碗師（樂）、釜師（大西）、塗師（中村）、指物師（駒澤）、金物師（中川）、袋師（土田）、表具師（奥村）、一閑張細工師（飛来）、竹細工・柄杓師（黒田）、土風炉・焼物師（永樂）。" },
  { id: "p27-kawai", f: "craft", q: "民藝運動に深く関わり、その住まいと仕事場が記念館になっている京都の陶工は？", c: ["河井寛次郎", "濱田庄司", "バーナード・リーチ", "富本憲吉"], e: "河井寛次郎記念館は五条坂の近く。濱田庄司は益子、リーチはイギリスの陶芸家。富本憲吉は民藝運動からは離れた色絵磁器の人間国宝。" },
  { id: "p27-kakatei", f: "arch", q: "相国寺承天閣美術館の展示室に復元されている、鹿苑寺（金閣寺）の茶室は？", c: ["夕佳亭", "時雨亭", "捨翠亭", "松琴亭"], e: "夕佳亭は金森宗和の好みと伝わる。松琴亭は桂離宮、時雨亭は高台寺、捨翠亭は京都御苑の九条家の茶室。" },
  { id: "p27-nijoeki", f: "arch", q: "京都鉄道博物館に移されている、1904年に建てられた木造の駅舎は？", c: ["旧二条駅舎", "旧京都駅舎", "旧嵯峨駅舎", "旧梅小路駅舎"], e: "現存する日本最古級の木造駅舎のひとつ。今はミュージアムショップとして使われている。" },
  { id: "p27-konosuke", f: "history", q: "幕末維新ミュージアム「霊山歴史館」の初代館長を務めた実業家は？", c: ["松下幸之助", "稲盛和夫", "大倉喜八郎", "野村徳七"], e: "東山の別邸「真々庵」でも知られる。野村徳七は南禅寺界隈の碧雲荘を造った。" },
  { id: "p27-onibasu", f: "street", q: "亀岡市の平の沢池に自生する、大きな葉の水草は？", c: ["オニバス", "ジュンサイ", "ミツガシワ", "ハス"], e: "亀岡市の市の花になった。" },
  { id: "p27-kotodaki", f: "street", q: "京丹波町にある、府内最大級の落差約43mの滝は？", c: ["琴滝", "金引の滝", "龍王ヶ滝", "布引の滝"], e: "金引の滝は宮津市、龍王ヶ滝は綾部市にある。" },
  { id: "p27-motoise", f: "temple", q: "福知山市大江町にあり、ピラミッドのような日室ヶ嶽を神体山とする神社は？", c: ["元伊勢内宮皇大神社", "籠神社", "出雲大神宮", "大原神社"], e: "大江町には元伊勢の内宮・外宮がある。籠神社は宮津の元伊勢、出雲大神宮は亀岡の元出雲。" },
  { id: "p27-kimiosan", f: "street", q: "綾部市にあり、仁王門が国宝の光明寺と、樹齢2000年といわれる大栃がある山は？", c: ["君尾山", "鉢伏山", "行者山", "大江山"], e: "大江山は福知山・与謝野にまたがる酒呑童子の山。" },
  { id: "p27-kurotani", f: "craft", q: "綾部市の限られた地域で、楮を原料に昔ながらの手漉きを守る和紙は？", c: ["黒谷和紙", "丹後藤布", "京からかみ", "土佐和紙"], e: "府の無形文化財。丹後藤布は藤のつるの繊維で織る布、京からかみは版木で文様を摺る襖紙。" },
  { id: "p27-kokonoe", f: "temple", q: "常照皇寺にあり、京都でただ一つ天然記念物になっている樹齢約650年の桜は？", c: ["九重桜", "御車返しの桜", "御室桜", "西行桜"], e: "常照皇寺は光厳上皇が開いた京北の禅寺。御車返しの桜も同じ寺にある。" },
  { id: "p27-kandenden", f: "festival", q: "壬生大念仏狂言の、鉦や太鼓の音から付いた愛称は？", c: ["カンデンデン", "チョーライ", "コンチキチン", "サイレイヤ"], e: "コンチキチンは祇園囃子、サイレイヤは鞍馬の火祭の掛け声。" },
  { id: "p27-modoribayashi", f: "festival", q: "山鉾巡行で、お囃子がゆったりした「渡り囃子」からテンポの速い「戻り囃子」に変わる交差点は？", c: ["四条河原町", "四条烏丸", "河原町御池", "新町御池"], e: "東へ進んで河原町で辻回しをした後、戻りの気分になる。" },
  { id: "p27-oshikicho", f: "temple", q: "音の高さから「黄鐘調の鐘」と呼ばれる国宝の梵鐘がある寺は？", c: ["妙心寺", "知恩院", "方広寺", "相国寺"], e: "698年の銘をもつ日本最古の梵鐘。知恩院は日本三大梵鐘のひとつ、方広寺は「国家安康」の鐘。" },
  { id: "p27-hakuun", f: "temple", q: "「御所の弁天さん」と呼ばれ、音楽や芸事の上達を願う京都御苑の神社は？", c: ["白雲神社", "厳島神社", "宗像神社", "梨木神社"], e: "西園寺家の鎮守社で、妙音弁財天を祀る。厳島神社は唐破風鳥居、宗像神社は御苑の南西の神社。" },
  { id: "p27-suikinkutsu", f: "arch", q: "地中に埋めた甕に落ちる水滴の音を響かせる、庭の仕掛けは？", c: ["水琴窟", "鹿威し", "筧", "手水鉢"], e: "退蔵院や宝泉院などにある。鹿威しは竹筒が石を打って鳴る仕掛けで、詩仙堂の石川丈山が考えたといわれる。" },
  { id: "p27-nagata", f: "craft", q: "「月はおぼろに東山」で始まる「祇園小唄」を作詞したのは？", c: ["長田幹彦", "吉井勇", "与謝野晶子", "谷崎潤一郎"], e: "1930年。吉井勇は「かにかくに祇園はこひし」の歌で、白川に歌碑がある。" },
);
// 過去問（第25回・2024年 2級）で問われた事実をもとにした自作問題
KQ.push(
  { id: "p25-haji", f: "history", q: "桓武天皇の母の母方の一族で、菅原道真の菅原氏ももとはこの一族から出た豪族は？", c: ["土師氏", "賀茂氏", "小野氏", "秦氏"], e: "土師氏は古墳づくりや葬送に関わった一族で、のちに菅原・秋篠・大枝に改姓した。賀茂氏は上賀茂・下鴨の社家、小野氏は小野妹子や小野篁の一族、秦氏は太秦の渡来系氏族。" },
  { id: "p25-tango", f: "history", q: "713年、丹波国の北部の5郡を分けて置かれた国は？", c: ["丹後国", "但馬国", "若狭国", "山城国"], e: "加佐・与謝・丹波（のちの中郡）・竹野・熊野の5郡。国府は今の宮津市のあたりとされる。但馬は兵庫県北部、若狭は福井県西部。" },
  { id: "p25-oguromaro", f: "history", q: "平安京の造宮大夫となり、桓武天皇の命で葛野の地相を見に行ったのは？", c: ["藤原小黒麻呂", "藤原種継", "和気清麻呂", "坂上田村麻呂"], e: "793年、紀古佐美とともに葛野を視察した。藤原種継は長岡京の造営長官で暗殺された人。和気清麻呂は平安遷都を進言したとされ、のちに造宮大夫も務めた。" },
  { id: "p25-enshoji", f: "history", q: "「六勝寺」のうち、今の京都市京セラ美術館のあたりにあった、待賢門院の御願寺は？", c: ["円勝寺", "法勝寺", "尊勝寺", "延勝寺"], e: "六勝寺：法勝寺（白河）・尊勝寺（堀河）・最勝寺（鳥羽）・円勝寺（待賢門院）・成勝寺（崇徳）・延勝寺（近衛）。法勝寺には八角九重塔がそびえた。" },
  { id: "p25-shochu", f: "history", q: "1324年、後醍醐天皇と側近の鎌倉幕府打倒の計画が漏れた事件は？", c: ["正中の変", "元弘の変", "承久の乱", "明徳の乱"], e: "日野資朝らが処罰された。元弘の変（1331年）は2度目の倒幕計画で、天皇は笠置山へ逃れた。承久の乱は1221年の後鳥羽上皇の挙兵、明徳の乱は1391年の山名氏の反乱。" },
  { id: "p25-ogurusu", f: "history", q: "山崎の戦いに敗れた明智光秀が、落ちのびる途中で討たれたと伝わる「明智藪」がある地は？", c: ["小栗栖", "山崎", "勝竜寺", "醍醐"], e: "伏見区小栗栖。光秀は勝竜寺城から坂本城をめざしていた。山崎は戦場の天王山のふもと。" },
  { id: "p25-omura", f: "history", q: "長州藩の軍事を指導し陸軍の創設に力を尽くしたが、1869年に木屋町で襲われ、のちに亡くなったのは？", c: ["大村益次郎", "佐久間象山", "吉田稔麿", "久坂玄瑞"], e: "木屋町御池上ルに遭難の碑がある。佐久間象山は1864年に同じ木屋町で暗殺された。吉田稔麿は池田屋事件、久坂玄瑞は禁門の変で亡くなった。" },
  { id: "p25-matsumoto", f: "history", q: "京丹後市の間人の出身で、「東の渋沢、西の松本」と呼ばれた関西の実業家は？", c: ["松本重太郎", "小林一三", "野村徳七", "稲畑勝太郎"], e: "銀行・鉄道・紡績など多くの会社の設立に関わった。小林一三は阪急、野村徳七は野村財閥、稲畑勝太郎は京都でシネマトグラフを初めて上映した実業家。" },
  { id: "p25-tatsumi", f: "temple", q: "祇園白川の巽橋のたもとにあり、舞妓や芸妓が芸の上達を願う小さな社は？", c: ["辰巳大明神", "安井金比羅宮", "恵美須神社", "観亀稲荷神社"], e: "京都御所の東南（辰巳）の守りともいわれる。安井金比羅宮は縁切り縁結び、恵美須神社は十日ゑびす。" },
  { id: "p25-fukuoji", f: "temple", q: "仁和寺の鎮守社で、宇多天皇の母・班子女王を祀るのは？", c: ["福王子神社", "平野神社", "今宮神社", "大将軍八神社"], e: "班子女王は光孝天皇の女御で多くの皇子女を産んだ。周山街道の分かれ道に建つ。平野神社は桜、今宮神社はあぶり餅、大将軍八神社は方除けで知られる。" },
  { id: "p25-ryoanji", f: "temple", s: "ryoanji", q: "細川勝元が妙心寺の義天玄承を招いて開いた寺は？", c: ["龍安寺", "大徳寺", "等持院", "仁和寺"], e: "応仁の乱で焼けたのち、子の政元が再興した。徳川光圀の寄進と伝わる「吾唯足知」のつくばいがある。等持院は足利家の菩提寺。" },
  { id: "p25-obaiin", f: "temple", s: "daitokuji", q: "織田信長が父の追善のために建て、千利休作と伝わる「直中庭」がある大徳寺の塔頭は？", c: ["黄梅院", "総見院", "聚光院", "大仙院"], e: "直中庭は秀吉の馬印の千成瓢箪をかたどった池がある。総見院は秀吉が信長のために建てた塔頭、聚光院は三好家ゆかりで利休の墓がある、大仙院は枯山水の名庭。" },
  { id: "p25-iwayaji", f: "temple", q: "赤穂浪士の大石内蔵助が隠れ住み、境内に遺髪塚がある山科の寺は？", c: ["岩屋寺", "瑞光院", "泉岳寺", "毘沙門堂"], e: "討ち入り前の約1年半をここで過ごしたとされる。泉岳寺は東京の浅野家の菩提寺、毘沙門堂は山科の天台宗の門跡。" },
  { id: "p25-shorinin", f: "temple", q: "1186年の大原問答で、本尊が光を放ち法然の説が正しいと示したという「証拠の阿弥陀」がある寺は？", c: ["勝林院", "来迎院", "寂光院", "三千院"], e: "勝林院・来迎院はどちらも天台声明の道場。寂光院は建礼門院の寺、三千院は門跡寺院。" },
  { id: "p25-choonkaku", f: "arch", s: "ginkaku", q: "銀閣の上層（禅宗様の仏堂）の名は？", c: ["潮音閣", "心空殿", "究竟頂", "法水院"], e: "下層は心空殿。究竟頂と法水院は金閣の上層と下層の名。金閣の中層は潮音洞で、銀閣の「潮音閣」と混同しやすい。" },
  { id: "p25-udatsu", f: "arch", q: "京町家で、隣家との境の壁を屋根より一段高く上げ、小屋根を載せた防火壁は？", c: ["うだつ", "虫籠窓", "犬矢来", "ばったり床几"], e: "「うだつが上がらない」の語源ともいわれる。虫籠窓は2階の格子状の窓、犬矢来は壁の下を守る竹の囲い、ばったり床几は折りたたみ式の縁台。" },
  { id: "p25-gardiner", f: "arch", q: "村井吉兵衛の別邸「長楽館」や聖アグネス教会を設計したアメリカ人建築家は？", c: ["J.M.ガーディナー", "W.M.ヴォーリズ", "ジョサイア・コンドル", "ブルーノ・タウト"], e: "ガーディナーは宣教師として来日した。ヴォーリズは近江八幡を拠点に教会や学校を多く設計、コンドルは東京の鹿鳴館、タウトは桂離宮を称賛したドイツの建築家。" },
  { id: "p25-toshitsuna", f: "arch", q: "日本最古の庭づくりの書『作庭記』をまとめたとされる、藤原頼通の子は？", c: ["橘俊綱", "藤原定家", "慶滋保胤", "藤原師実"], e: "俊綱は橘家の養子となった。伏見に名高い山荘を営んだ。藤原定家は『小倉百人一首』の撰者、慶滋保胤は『池亭記』の作者。" },
  { id: "p25-suzaku", f: "arch", q: "平安遷都1200年を記念して、梅小路公園に京都の作庭技術を集めて造られた池泉回遊式庭園は？", c: ["朱雀の庭", "清流園", "余香苑", "水景園"], e: "1995年の完成。清流園は二条城の昭和の庭、余香苑は退蔵院の中根金作の庭、水景園はけいはんな記念公園の庭。" },
  { id: "p25-yokoen", f: "arch", q: "妙心寺退蔵院にある、中根金作が設計した池泉回遊式の庭は？", c: ["余香苑", "松風苑", "楽水苑", "遊仙苑"], e: "昭和の作。退蔵院には室町の枯山水「元信の庭」と国宝の「瓢鮎図」もある。" },
  { id: "p25-rosetsu", f: "arch", q: "円山応挙に学び、「奇想の絵師」と呼ばれる画家は？", c: ["長沢芦雪", "伊藤若冲", "曾我蕭白", "松村呉春"], e: "南紀の無量寺の龍虎図で知られる。若冲・蕭白も奇想の絵師だが、応挙の弟子ではない。呉春は応挙の影響を受けて四条派を開いた。" },
  { id: "p25-soan", f: "craft", q: "本阿弥光悦の書と俵屋宗達の下絵を使った美しい謡本「嵯峨本」を出版したのは？", c: ["角倉素庵", "茶屋四郎次郎", "尾形光琳", "後藤庄三郎"], e: "素庵は角倉了以の子。茶屋四郎次郎は家康に仕えた呉服商、後藤庄三郎は金座の御金改役。" },
  { id: "p25-yoshufushi", f: "craft", q: "1686年に完成した山城国の地誌『雍州府志』を著したのは？", c: ["黒川道祐", "秋里籬島", "貝原益軒", "林羅山"], e: "秋里籬島は『都名所図会』の作者、貝原益軒は『京城勝覧』などの名所案内も書いた儒学者。" },
  { id: "p25-basho-goryo", f: "craft", q: "上御霊神社に「半日は 神を友にや 年忘れ」の句碑がある俳人は？", c: ["松尾芭蕉", "与謝蕪村", "向井去来", "小林一茶"], e: "蕪村は芭蕉を慕って金福寺の芭蕉庵を再興した。向井去来は嵯峨の落柿舎の主。" },
  { id: "p25-asukai", f: "craft", q: "白峯神宮の地に屋敷があった飛鳥井家の家職は？", c: ["蹴鞠", "雅楽", "書道", "香道"], e: "白峯神宮の精大明神は蹴鞠の神で、球技の上達を願う人が参る。蹴鞠の家は飛鳥井家と難波家。" },
  { id: "p25-kiishu", f: "craft", q: "表千家の江岑宗左が茶頭として仕えた大名家は？", c: ["紀州徳川家", "加賀前田家", "尾張徳川家", "讃岐松平家"], e: "裏千家の仙叟宗室は加賀前田家に、武者小路千家の一翁宗守は讃岐高松松平家に仕えた。" },
  { id: "p25-tsuchigumo", f: "craft", q: "千本ゑんま堂大念仏狂言で演じられる、源頼光の伝説にもとづく演目は？", c: ["土蜘蛛", "羅生門", "大江山", "紅葉狩"], e: "頼光が病の床で土蜘蛛を退治する話。北区には「蜘蛛塚」の伝承もある。" },
  { id: "p25-chikamatsu", f: "craft", q: "坂田藤十郎と組んで上方歌舞伎を書き、浄瑠璃『堀川波鼓』も書いた作者は？", c: ["近松門左衛門", "並木五瓶", "竹田出雲", "鶴屋南北"], e: "『堀川波鼓』には京の通り名の歌が出てくる。並木五瓶は上方から江戸に移った歌舞伎作者、竹田出雲は『仮名手本忠臣蔵』の作者のひとり、鶴屋南北は江戸の作者。" },
  { id: "p25-maiogi", f: "festival", q: "12月13日の事始めで、祇園甲部の芸舞妓が井上流の家元にあいさつしたときに受け取るものは？", c: ["舞扇", "おこぼ", "花簪", "鏡餅"], e: "家元から舞扇を受け取り、新しい年の精進を誓う。おこぼは舞妓の高下駄。" },
  { id: "p25-kotobukikai", f: "festival", q: "上七軒で秋に開かれる舞踊の公演は？", c: ["寿会", "温習会", "水明会", "みずゑ会"], e: "上七軒の春は北野をどり。温習会は祇園甲部の秋、水明会は祇園東、みずゑ会は宮川町の秋の会。" },
  { id: "p25-sakko", f: "life", q: "舞妓が芸妓になる前の2週間ほどだけ結う髪形は？", c: ["先笄", "割れしのぶ", "おふく", "奴島田"], e: "襟替えの前に結い、お歯黒もする。割れしのぶは舞妓になってまもないころ、おふくはその後に結う髪形。" },
  { id: "p25-jonangu-nanakusa", f: "festival", q: "城南宮で2月11日に神前に供えたあと、参拝者にふるまわれるものは？", c: ["七草粥", "甘酒", "あぶり餅", "粟餅"], e: "無病息災を願う。あぶり餅は今宮神社の門前、粟餅は北野天満宮の門前の名物。" },
  { id: "p25-asahinomori", f: "festival", q: "松尾祭の還幸祭で神輿が集まる「旭の杜」があるのは？", c: ["西寺跡", "羅城門跡", "大極殿跡", "鳥羽離宮跡"], e: "西寺跡の唐橋。ここで神饌を供えてから松尾大社へ帰る。" },
  { id: "p25-shizuka", f: "festival", q: "神泉苑の祭りで奉納される舞の主人公で、ここで雨乞いの舞を舞ったと伝わる白拍子は？", c: ["静御前", "祇王", "仏御前", "常盤御前"], e: "源義経と出会った場所ともいわれる。祇王と仏御前は平清盛に仕えた白拍子で、嵯峨野の祇王寺ゆかり。常盤御前は義経の母。" },
  { id: "p25-ashizoroe", f: "festival", q: "5月5日の賀茂競馬で走る馬の組み合わせを決める、5月1日の行事は？", c: ["足汰式", "流鏑馬神事", "歩射神事", "走馬の儀"], e: "上賀茂神社の馬場で馬の走りを見る。流鏑馬神事は5月3日の下鴨神社、歩射神事は5月5日の下鴨神社。" },
  { id: "p25-iwatoyama", f: "festival", q: "山なのに鉾のような車輪がつき、屋根の上に伊弉諾尊を祀る祇園祭の山は？", c: ["岩戸山", "船鉾", "南観音山", "鷹山"], e: "天岩戸の神話を題材にした曳山。船鉾は神功皇后、南観音山は楊柳観音、鷹山は2022年に巡行に復帰した。" },
  { id: "p25-ojakuzo", f: "festival", q: "『山州名跡志』で、大文字の「大」の字を定めたと記される室町時代の五山僧は？", c: ["横川景三", "亀泉集証", "景徐周麟", "絶海中津"], e: "足利義政が子の義尚の冥福を願って灯させたという説に結びつく。大文字の起源には空海説・足利義政説・近衛信尹説がある。" },
  { id: "p25-osunafumi", f: "festival", q: "9月に今熊野観音寺で行われ、四国八十八ヶ所を一日で巡ったのと同じ功徳があるとされる行事は？", c: ["お砂踏法要", "萩まつり", "八朔祭", "千灯供養"], e: "四国の霊場の砂を踏んで巡る。萩まつりは梨木神社、千灯供養は化野念仏寺。" },
  { id: "p25-shishi", f: "festival", q: "1966年の孝明天皇百年祭を記念して時代祭に加えられた、20〜30代の青年が中心の列は？", c: ["維新志士列", "維新勤王隊列", "江戸時代婦人列", "徳川城使上洛列"], e: "坂本龍馬や桂小五郎らに扮する。維新勤王隊列は山国隊にちなむ先頭の列、江戸時代婦人列には和宮や大田垣蓮月が登場する。" },
  { id: "p25-ikama", f: "food", q: "吉田神社の山蔭神社の例祭で、料理業界の人が披露する包丁式の流派は？", c: ["生間流", "四条流", "大草流", "園部流"], e: "山蔭神社は料理の神・藤原山蔭を祀る。生間流は京都に伝わる式包丁の流派。" },
  { id: "p25-hatsuuma", f: "food", q: "2月の初午の日に食べると縁起がよいとされる料理は？", c: ["畑菜の辛子和え", "いもぼう", "鯖寿司", "にしんなす"], e: "畑菜は伏見稲荷の神が稲を担いで現れた畑にちなむ。いもぼうは円山公園の名物、鯖寿司は祭りのごちそう。" },
  { id: "p25-kuwai", f: "food", q: "大きな芽が出ることから「めでたい」と正月料理に使われる京野菜は？", c: ["くわい", "えびいも", "堀川ごぼう", "聖護院かぶ"], e: "えびいもは「頭芋」として正月の雑煮や棒鱈との「いもぼう」に使う。堀川ごぼうは聚楽第の堀で育ったと伝わる。" },
  { id: "p25-hanabira", f: "food", q: "宮中の正月の菓子「菱葩」がもとで、明治以降に裏千家の初釜に使われるようになった京菓子は？", c: ["はなびら餅", "引千切", "亥の子餅", "法螺貝餅"], e: "白い求肥に味噌餡とごぼうを包む。引千切は雛祭り、亥の子餅は11月の亥の日、法螺貝餅は節分の菓子。" },
  { id: "p25-iwataobi", f: "festival", q: "祇園祭の占出山・船鉾・大船鉾で授かる安産の腹帯（岩田帯）は、どの神にちなむ？", c: ["神功皇后", "楊柳観音", "瀬織津姫命", "伊弉諾尊"], e: "三基ともご神体が神功皇后。楊柳観音は南観音山・北観音山、伊弉諾尊は岩戸山。" },
  { id: "p25-inu", f: "life", q: "京ことばの「イヌ」の意味は？", c: ["帰る", "捨てる", "からかう", "すねる"], e: "「もう、いにますわ」のように使う。" },
  { id: "p25-oyakamassan", f: "life", q: "「お邪魔しました」を京ことばで何という？", c: ["オヤカマッサン", "オコシヤス", "オタノモウシマス", "オーキニ"], e: "オコシヤスは「いらっしゃい」、オタノモウシマスは訪ねたときの「ごめんください」。" },
  { id: "p25-somin", f: "life", q: "牛頭天王に宿を貸して疫病を免れたという伝説の人物で、八坂神社の疫神社に祀られるのは？", c: ["蘇民将来", "巨旦将来", "道祖神", "小野篁"], e: "7月31日の夏越祭で「蘇民将来子孫也」のお守りを授かる。巨旦将来は宿を断った裕福な弟。" },
  { id: "p25-ryoton", f: "street", q: "桃山時代の茶人の屋敷にちなむ、室町通と新町通の間を三条から六角まで抜ける細い道は？", c: ["了頓図子", "膏薬図子", "撞木図子", "だいうすの辻子"], e: "広野了頓の屋敷があった。膏薬図子は平将門を祀る神田明神がある四条の図子、だいうすの辻子はキリシタンの南蛮寺の近くの道。" },
  { id: "p25-akuoji", f: "street", q: "烏丸五条の「悪王子町」の名の由来となった悪王子社は、今どこの境内にある？", c: ["八坂神社", "御香宮神社", "今宮神社", "平野神社"], e: "素戔嗚尊の荒御魂を祀る。" },
  { id: "p25-fujibakama", f: "street", q: "『源氏物語』の巻名にもなった秋の七草で、革堂や下御霊神社で保全の成果が展示されるのは？", c: ["藤袴", "女郎花", "撫子", "桔梗"], e: "かつて京都に多く自生していたが、今は野生のものが少ない。第30帖「藤袴」。" },
  { id: "p25-ayumodoki", f: "street", q: "亀岡市付近の桂川水系にすみ、国の天然記念物に指定されている日本固有の淡水魚は？", c: ["アユモドキ", "イチモンジタナゴ", "オオサンショウウオ", "アブラハヤ"], e: "オオサンショウウオは特別天然記念物だが両生類。イチモンジタナゴは琵琶湖・淀川水系の絶滅危惧種。" },
  { id: "p25-nagarebashi", f: "street", q: "八幡市と久御山町を結ぶ、増水すると橋板が流れる「流れ橋」が架かる川は？", c: ["木津川", "宇治川", "桂川", "鴨川"], e: "正式名は上津屋橋。時代劇の撮影によく使われる。" },
  { id: "p25-hikokuro", f: "street", s: "sanjo-ohashi", q: "三条大橋の東詰にある、御所に向かって拝む像は誰？", c: ["高山彦九郎", "坂本龍馬", "角倉了以", "弥次郎兵衛"], e: "「土下座像」と呼ばれ、待ち合わせの目印。弥次喜多の像は三条大橋の西詰にある。" },
  { id: "p25-takarayama", f: "street", q: "福知山市夜久野にある、京都府でただ一つの火山は？", c: ["宝山（田倉山）", "大江山", "君尾山", "愛宕山"], e: "玄武岩の柱状節理が見られる。" },
  { id: "p25-mozume", f: "history", q: "戦国時代の西岡の国人の城跡で、2024年に国の史跡に指定された向日市の城跡は？", c: ["物集女城跡", "勝竜寺城跡", "淀城跡", "園部城跡"], e: "堀と土塁がよく残る。勝竜寺城は細川藤孝が整えた城、淀城は江戸時代の城、園部城は日本で最後に築かれた城。" },
  { id: "p25-shoeikan", f: "arch", q: "1884年に建てられ、京都市内で2番目に古いれんが建築として重要文化財の同志社の建物は？", c: ["彰栄館", "クラーク記念館", "有終館", "ハリス理化学館"], e: "同志社に残る最古の建物で、京都市内でも2番目に古いれんが建築とされる。クラーク記念館・有終館・ハリス理化学館も同志社の重要文化財。" },
  { id: "p25-nakagyo", f: "arch", q: "取り壊し反対運動のあと、外壁だけを残して建て替え、今も郵便局として使われる三条通の建物は？", c: ["中京郵便局", "日本銀行京都支店", "京都中央電話局", "毎日新聞京都支局"], e: "1902年の建物。日本銀行京都支店は京都文化博物館別館に、京都中央電話局は商業施設「新風館」に、毎日新聞京都支局は「1928ビル」になった。" },
  { id: "p25-nejirimanpo", f: "arch", q: "蹴上インクラインの下をくぐる、れんがが螺旋状に積まれたトンネルは？", c: ["ねじりまんぽ", "水路閣", "第一隧道", "眼鏡橋"], e: "斜めに交差するための積み方。水路閣は南禅寺境内の水路橋。" },
  { id: "p25-kansai-bijutsuin", f: "arch", q: "洋画家・浅井忠が開いた関西美術院の建物を設計した、京都府立図書館の設計者は？", c: ["武田五一", "松室重光", "片山東熊", "前田健二郎"], e: "武田五一は京都高等工芸学校の教授で「関西建築界の父」。" },
  { id: "p25-miyazu", f: "arch", q: "1896年にフランス人神父が設計し、畳敷きの会衆席をもつ、2024年に重要文化財になった教会は？", c: ["カトリック宮津教会", "京都ハリストス正教会", "聖アグネス教会", "京都復活教会"], e: "現役の教会として使われる木造教会。ハリストス正教会は松室重光の設計。" },
  { id: "p25-artcenter", f: "arch", q: "心学の明倫舎の流れをくむ明倫小学校の昭和の校舎を活かした施設は？", c: ["京都芸術センター", "京都国際マンガミュージアム", "京都市学校歴史博物館", "京都市立芸術大学"], e: "1931年の校舎。マンガミュージアムは龍池小学校、学校歴史博物館は開智小学校の校舎を使う。" },
  { id: "p25-chuta", f: "arch", q: "本願寺伝道院や大雲院の祇園閣を設計した、日本建築史研究の先駆者は？", c: ["伊東忠太", "武田五一", "辰野金吾", "片山東熊"], e: "平安神宮の設計にも関わった。辰野金吾は日本銀行京都支店、片山東熊は京都国立博物館。" },
  { id: "p25-chochikukyo", f: "arch", s: "chochikukyo", q: "藤井厚二が大山崎に建てた自邸で、「木造モダニズム建築の傑作」とされるのは？", c: ["聴竹居", "林谷文庫", "楽々荘", "大山崎山荘"], e: "1928年の建物。大山崎山荘は加賀正太郎の山荘で、今はアサヒグループの美術館。楽々荘は亀岡の田中源太郎の旧邸。" },
  { id: "p25-icc", f: "arch", s: "icc", q: "大谷幸夫の設計で、台形と逆台形を組み合わせた宝ヶ池の建物は？", c: ["国立京都国際会館", "みやこめっせ", "京都産業会館", "京都会館"], e: "1966年開館。京都会館（今のロームシアター京都）は前川國男の設計。" },
  { id: "p25-izure", f: "craft", q: "『源氏物語』の書き出しは？", c: ["いづれの御時にか", "祇園精舎の鐘の声", "春はあけぼの", "むかし、男ありけり"], e: "「祇園精舎」は『平家物語』、「春はあけぼの」は『枕草子』、「むかし、男ありけり」は『伊勢物語』。" },
  { id: "p25-nikki", f: "craft", q: "1008年の記事に「若紫」や「源氏」の名が見え、『源氏物語』がこのころ成立していたとわかる書物は？", c: ["紫式部日記", "御堂関白記", "小右記", "権記"], e: "この記事から11月1日は「古典の日」になった。御堂関白記は藤原道長、小右記は藤原実資、権記は藤原行成の日記。" },
  { id: "p25-toru", f: "history", q: "光源氏のモデルのひとりとされ、河原院を営んだ嵯峨天皇の皇子は？", c: ["源融", "源高明", "源信", "源経基"], e: "融の嵯峨の別荘・棲霞観は没後に寺となり、清凉寺の前身となった。源高明もモデルとされるが醍醐天皇の皇子。源経基は清和源氏の祖。" },
  { id: "p25-ukifune", f: "street", q: "宇治十帖の古跡のうち「浮舟」の古跡がある寺は？", c: ["三室戸寺", "平等院", "県神社", "橋寺放生院"], e: "宇治十帖の古跡は宇治川の両岸に点在する。" },
  { id: "p25-daini", f: "craft", q: "紫式部の娘で、小倉百人一首にも歌が入る歌人は？", c: ["大弐三位", "小式部内侍", "伊勢大輔", "赤染衛門"], e: "「有馬山 猪名の笹原 風吹けば」の歌。小式部内侍は和泉式部の娘。母娘の歌碑は廬山寺にある。" },
  { id: "p25-murasaki-haka", f: "history", q: "堀川北大路の近くにある紫式部の墓と、並んで建つのは誰の墓？", c: ["小野篁", "藤原道長", "清少納言", "安倍晴明"], e: "篁は閻魔の庁に仕えたという伝説から、紫式部を地獄から救ったという話が生まれた。千本ゑんま堂（引接寺）には紫式部の供養塔とされる十三重石塔がある。" },
  { id: "p25-suminokura", f: "history", q: "高瀬川や大堰川の水運を開いた豪商は？", c: ["角倉了以", "茶屋四郎次郎", "灰屋紹益", "後藤庄三郎"], e: "子の素庵とともに事業を進めた。灰屋紹益は吉野太夫を妻にした豪商。" },
  { id: "p25-ogai", f: "craft", q: "高瀬舟を題材にした短編小説『高瀬舟』を書いたのは？", c: ["森鷗外", "谷崎潤一郎", "梶井基次郎", "川端康成"], e: "梶井基次郎は京都の丸善を舞台にした『檸檬』、川端康成は『古都』。" },
);
// 過去問（第23回・2023年 2級）で問われた事実をもとにした自作問題
KQ.push(
  { id: "p23-byakko", f: "history", q: "四神相応で、平安京の西を守る「白虎」にあたるとされたのは？", c: ["山陰道", "巨椋池", "船岡山", "鴨川"], e: "東の青龍は鴨川、南の朱雀は巨椋池、北の玄武は船岡山。白虎は西へ向かう大道（山陰道）とされる。" },
  { id: "p23-jobo", f: "history", q: "平安京の、碁盤の目のような都市区画の制度は？", c: ["条坊制", "条里制", "班田制", "郡県制"], e: "条坊制は都の中の区画。条里制は地方の田地を碁盤目に区切った制度で、混同しやすい。" },
  { id: "p23-rakuyo", f: "history", q: "平安京の右京を長安城と呼んだのに対して、左京は何と呼ばれた？", c: ["洛陽城", "開封城", "北京城", "南京城"], e: "右京がさびれ左京が栄えたので、京都を「洛」と呼ぶようになった。「上洛」「洛中」もここから。" },
  { id: "p23-reishi", f: "history", q: "嵯峨天皇の皇女に始まる賀茂斎院で、最後の斎院となった後鳥羽天皇の皇女は？", c: ["礼子内親王", "有智子内親王", "選子内親王", "式子内親王"], e: "有智子内親王は初代。選子内親王は5代の天皇の時代に斎院を務め「大斎院」と呼ばれた。式子内親王は歌人として名高い斎院。" },
  { id: "p23-kagariya", f: "history", q: "鎌倉時代、六波羅探題のもとで京中の辻々48か所に置かれた警固の詰所は？", c: ["篝屋", "番屋", "京職", "大番役"], e: "夜にかがり火をたいて守ったことから。大番役は御家人が交代で京を警固した役目そのもの。" },
  { id: "p23-kanbun", f: "history", q: "江戸時代、京都所司代の板倉重矩のもとで鴨川に築かれ、先斗町が生まれるもとになった堤は？", c: ["寛文新堤", "御土居", "防鴨河使", "デ・レーケ堤"], e: "1670年ごろ、今出川から五条までの石垣の堤。防鴨河使は平安時代に鴨川の治水を担った官職。" },
  { id: "p23-mukaijima", f: "history", q: "宇治川の水運の要所で、本丸町・二ノ丸町の町名が残る「向島城」を築いたのは？", c: ["豊臣秀吉", "徳川家康", "織田信長", "松平定綱"], e: "伏見城の出城として築かれた。松平定綱は江戸初期に淀城を築いた大名。" },
  { id: "p23-iemochi", f: "history", q: "1863年、将軍として229年ぶりに上洛し、二条城に入った徳川将軍は？", c: ["徳川家茂", "徳川慶喜", "徳川家光", "徳川家斉"], e: "前の上洛は1634年の家光。慶喜は将軍になる前から京都にいて、将軍として二条城で大政奉還を表明した。" },
  { id: "p23-kikujiro", f: "history", q: "京都市三大事業（第二琵琶湖疏水・上水道・道路拡築と市電）を進めた2代目京都市長は？", c: ["西郷菊次郎", "内貴甚三郎", "北垣国道", "槇村正直"], e: "西郷隆盛の長男。内貴甚三郎は初代市長、北垣国道と槇村正直は京都府知事。" },
  { id: "p23-mitoshiro", f: "festival", q: "7月1日に五穀豊穣を祈る「御戸代会神事」があり、明神川沿いに社家町が残る神社は？", c: ["上賀茂神社", "下鴨神社", "松尾大社", "貴船神社"], e: "上賀茂神社は山城国一之宮（下鴨神社とともに）。社家町は重要伝統的建造物群保存地区。" },
  { id: "p23-rokuson", f: "temple", q: "清和源氏の祖・源経基を祀り、本殿の裏に経基の墓がある南区の神社は？", c: ["六孫王神社", "若宮八幡宮", "首途八幡宮", "五條天神宮"], e: "子の満仲が西八条の旧宅跡に建てた。満仲誕生の産湯に使った誕生水弁財天社がある。" },
  { id: "p23-awo", f: "temple", q: "熊谷直実（法力房蓮生）が開いた念仏三昧院に始まり、法然の「張子の御影」がある長岡京市の寺は？", c: ["光明寺（粟生）", "金戒光明寺", "報国寺", "知恩院"], e: "法然の火葬の地とも伝わる西山浄土宗の総本山。金戒光明寺（黒谷）にも熊谷直実ゆかりの鎧掛けの松がある。" },
  { id: "p23-takaradera", f: "temple", q: "聖武天皇の即位伝説にまつわる打出と小槌を伝え、「宝寺」と呼ばれる大山崎の寺は？", c: ["宝積寺", "宝塔寺", "宝筐院", "宝鏡寺"], e: "天王山の中腹にある。宝塔寺は伏見の日蓮宗の寺、宝筐院は嵯峨の楠木正行ゆかりの寺、宝鏡寺は人形の寺。" },
  { id: "p23-darumadera", f: "temple", q: "「だるま寺」と呼ばれ、達磨堂に8000体ものだるまが奉納されている寺は？", c: ["法輪寺（中京区）", "東林院", "福勝寺", "称念寺"], e: "嵐山の法輪寺（虚空蔵さん）とは別。称念寺は「猫寺」、福勝寺は「ひょうたん寺」と呼ばれる。" },
  { id: "p23-chohoji", f: "temple", q: "西国三十三所第18番で、親鸞が百日参籠したことで知られる寺は？", c: ["頂法寺（六角堂）", "行願寺（革堂）", "六波羅蜜寺", "清水寺"], e: "聖徳太子の創建と伝わり、いけばなの池坊が住職を務める。革堂は19番、六波羅蜜寺は17番、清水寺は16番。" },
  { id: "p23-hitokoto", f: "temple", q: "醍醐寺の別格本山で、一生に一度ひとことだけ願えばかなう「一言観音」がある寺は？", c: ["金剛王院", "理性院", "即成院", "観智院"], e: "一言寺とも呼ばれる。観智院は東寺の塔頭で宮本武蔵の絵がある、即成院は泉涌寺の塔頭で二十五菩薩。" },
  { id: "p23-hachimanzukuri", f: "arch", q: "本殿が八幡造で、八幡市でただ一つ国宝の建物がある神社は？", c: ["石清水八幡宮", "御所八幡宮", "三宅八幡宮", "篠村八幡宮"], e: "八幡造は前後二つの建物を連結する形。篠村八幡宮は足利尊氏が倒幕の兵を挙げた亀岡の神社。" },
  { id: "p23-komayose", f: "arch", q: "京町家の軒下に置かれ、道と敷地の境を示し、昔は馬をつないだともいわれる低い柵は？", c: ["駒寄", "犬矢来", "ばったり床几", "虫籠窓"], e: "犬矢来は外壁の裾を守る曲がった竹の囲い。" },
  { id: "p23-bunkacho", f: "arch", q: "2023年に文化庁が移った京都の庁舎は、もとは何の建物？", c: ["京都府警察本部本館", "京都府庁旧本館", "京都府立図書館", "京都文化博物館別館"], e: "1928年築の建物を改修した。京都府庁旧本館は松室重光設計の1904年の建物で、今も公開されている。" },
  { id: "p23-tsukinoniwa", f: "arch", q: "洛中の「雪月花三名園」のうち、清水寺の成就院の庭は？", c: ["月の庭", "雪の庭", "花の庭", "巴の庭"], e: "雪の庭は妙満寺、花の庭は北野天満宮の旧庭（現存しない）とされる。巴の庭は本法寺の光悦作と伝わる庭。" },
  { id: "p23-gakubuchi", f: "arch", q: "天寧寺の「額縁門」から、絵のように見える山は？", c: ["比叡山", "愛宕山", "如意ヶ岳", "鞍馬山"], e: "天寧寺は寺町鞍馬口の曹洞宗の寺。門の枠が比叡山を切り取る。" },
  { id: "p23-seiho", f: "arch", q: "「班猫」で知られ、第1回の文化勲章を受けた京都画壇の画家は？", c: ["竹内栖鳳", "土田麦僊", "上村松園", "都路華香"], e: "上村松園は栖鳳の弟子で、女性で初めて文化勲章を受けた。土田麦僊も栖鳳の門下で国画創作協会を結成した。" },
  { id: "p23-jooo", f: "craft", q: "千利休の師で、四畳半の草庵の茶室を営み、わび茶を深めた茶人は？", c: ["武野紹鴎", "村田珠光", "古田織部", "小堀遠州"], e: "珠光はわび茶の祖で一休宗純に参禅した。古田織部は利休の弟子、小堀遠州は織部の弟子で「綺麗さび」。" },
  { id: "p23-sagagoryu", f: "craft", q: "いけばな嵯峨御流の総司所があり、嵯峨天皇の命日に華道祭を行う寺は？", c: ["大覚寺", "清凉寺", "鹿王院", "二尊院"], e: "嵯峨天皇が大沢池の菊を手折って生けたのが始まりと伝わる。" },
  { id: "p23-shigeyama", f: "craft", q: "江戸後期に京都で台頭した狂言の茂山家を召し抱えた大名家は？", c: ["彦根藩井伊家", "加賀藩前田家", "尾張藩徳川家", "長州藩毛利家"], e: "茂山家は「お豆腐狂言」の家として知られる。" },
  { id: "p23-takeuma", f: "festival", q: "顔見世のころ、南座で見られる花街から役者への贈り物は？", c: ["竹馬", "羽子板", "京人形", "まねき"], e: "祇園の芸舞妓が役者に贈り、劇場の中に飾られる。まねきは役者の名を書いた看板で、贈り物ではない。" },
  { id: "p23-hanayagi", f: "craft", q: "上七軒の芸舞妓が習う舞の流派は？", c: ["花柳流", "井上流", "尾上流", "若柳流"], e: "祇園甲部は井上流、先斗町は尾上流、宮川町は若柳流、祇園東は藤間流。" },
  { id: "p23-erikae", f: "life", q: "舞妓が芸妓になることを花街で何という？", c: ["襟替え", "店出し", "仕込み", "おちょぼ"], e: "赤い襟から白い襟に替わることから。店出しは舞妓としてのデビュー、仕込みは舞妓になる前の修業期間、おちょぼは髪形のこと。" },
  { id: "p23-okame", f: "festival", q: "千本釈迦堂（大報恩寺）にある、本堂を建てた大工の妻にちなむ塚は？", c: ["おかめ塚", "扇塚", "筆塚", "鬼塚"], e: "夫の失敗を救う知恵を出し、上棟の前に自ら命を絶ったと伝わる。節分にはおかめが鬼を笑顔でなだめる。" },
  { id: "p23-shato", f: "festival", q: "葵祭で、行列が下鴨・上賀茂の両社に着いたあと、勅使が御祭文を奏上する儀式は？", c: ["社頭の儀", "路頭の儀", "宮中の儀", "進発の儀"], e: "葵祭は宮中の儀・路頭の儀・社頭の儀の三つからなり、今は宮中の儀は行われない。" },
  { id: "p23-moso", f: "festival", q: "祇園祭の山で、病の母のために雪の中で筍を探した孝行息子の話を表すのは？", c: ["孟宗山", "郭巨山", "占出山", "太子山"], e: "中国の「二十四孝」の話。郭巨山も二十四孝で、母を養うために子を埋めようとして黄金を掘り当てた話。" },
  { id: "p23-kujitorazu", f: "festival", q: "後祭の「くじ取らず」の山鉾で、北観音山と隔年で巡行順を入れ替えることになったのは？", c: ["南観音山", "橋弁慶山", "鷹山", "大船鉾"], e: "橋弁慶山は後祭の先頭、大船鉾はしんがりで固定。" },
  { id: "p23-toriigata", f: "festival", q: "五山送り火で、いちばん西の曼荼羅山に灯るのは？", c: ["鳥居形", "左大文字", "舟形", "妙・法"], e: "嵯峨鳥居本。点火は最後で、松明を火床に差して灯す独特の方法。" },
  { id: "p23-kumogahata", f: "festival", q: "8月の松上げのうち、松明を投げ上げるのではなく、割り木で毎年違う文字をつくって灯すのは？", c: ["雲ケ畑", "花脊", "広河原", "久多"], e: "雲ケ畑の松上げ。花脊・広河原・久多は灯籠木の上の籠に松明を投げ入れる。" },
  { id: "p23-awata", f: "festival", q: "10月の神幸祭で、剣鉾差しが約40kgの剣鉾を一人で持って歩き、祇園祭の鉾の原形ともされる祭りは？", c: ["粟田祭", "今宮祭", "藤森祭", "御霊祭"], e: "粟田神社の祭り。夜渡り神事では提灯をつけた大燈呂が出る。" },
  { id: "p23-muromachi", f: "festival", q: "2007年に時代祭に加わった列は？", c: ["室町幕府執政列", "藤原公卿参朝列", "楠公上洛列", "中世婦人列"], e: "桓武天皇千二百年大祭を機に加わった。藤原公卿参朝列は平安時代の列、楠公上洛列は吉野時代の列、中世婦人列には大原女や桂女が登場する。" },
  { id: "p23-kakurenembutsu", f: "festival", q: "六波羅蜜寺の「かくれ念仏」を始めたとされる僧は？", c: ["空也", "一遍", "法然", "良忍"], e: "疫病の流行を鎮めようと念仏を唱えた。一遍は踊念仏、良忍は融通念仏の祖。" },
  { id: "p23-hanpei", f: "food", q: "10月のえびす講に食べる汁物「笹に小判」で、小判に見立てる食材は？", c: ["はんぺい", "丸餅", "ひろうす", "湯葉"], e: "青菜を笹に見立てる。京都のはんぺいは関東のはんぺんとは違う。" },
  { id: "p23-manganji", f: "food", q: "万願寺とうがらしの名の由来の「万願寺」地区がある市は？", c: ["舞鶴市", "綾部市", "福知山市", "亀岡市"], e: "伏見とうがらしとカリフォルニア・ワンダーの交配といわれる。" },
  { id: "p23-aruhei", f: "food", q: "室町時代末にポルトガル人から伝わった南蛮菓子は？", c: ["有平糖", "羊羹", "落雁", "八ツ橋"], e: "カステラ・ボーロ・金平糖・有平糖などが南蛮菓子。羊羹は中国から禅僧が伝えた点心がもと、落雁は中国伝来の打ち物、八ツ橋は江戸時代の京の菓子。" },
  { id: "p23-shinseimame", f: "food", q: "真盛上人が北野で説法したとき、炒った黒豆に大根の葉の粉をまぶして配ったのが始まりの豆菓子は？", c: ["真盛豆", "五色豆", "州浜", "福豆"], e: "西陣の老舗に伝わる。五色豆は5色の砂糖衣の豆、州浜は大豆粉の菓子。" },
  { id: "p23-1212", f: "life", q: "旧家などで逆さに貼られる「十二月十二日」のお札は、何のまじない？", c: ["盗難除け", "火除け", "疫病除け", "雷除け"], e: "石川五右衛門が捕まった日（処刑された日とも）にちなむという。" },
  { id: "p23-ikaki", f: "life", q: "京ことばの「イカキ」の意味は？", c: ["ざる", "茶せん", "竹籠", "おたま"], e: "竹で編んだざるのこと。" },

      ${q.e ? `<p class="kq-e">${esc(q.e)}</p>` : ""}
      ${sp ? `<button type="button" class="kq-map" data-open="${esc(sp.id)}" aria-label="${esc(shortName(sp))}を見る"><span class="kq-mapc" id="kqMap"></span><span class="kq-mapcap">${esc(shortName(sp))}<small>を見る →</small></span></button>` : ""}
      <div class="kq-foot"><button type="button" class="kq-flag" data-kflag aria-pressed="${kflag.includes(q.id)}">${kflag.includes(q.id) ? "△ いまいちに印済み" : "△ いまいち"}</button><button type="button" class="kbtn kq-next" data-knext>NEXT${nx && nx.via ? `<small>${esc(kTagLabel(nx.via))}</small>` : ""}</button></div>
    </div>` : ""}
  </div>`;
  if (sp) kDrawMap(sp);
}
// 京都の中のどこか：市街をいつも同じ枠で見せ、目印（御所・京都駅・嵐山）と並べて位置をつかむ
const K_MARKS = [["御所", [35.0254, 135.7621]], ["京都駅", [34.9858, 135.7588]], ["嵐山", [35.0094, 135.6668]], ["銀閣", [35.0270, 135.7982]], ["伏見稲荷", [34.9671, 135.7727]]];
let kmap = null;
function kDrawMap(sp) {
  if (kmap) { try { kmap.remove(); } catch (e) {} kmap = null; }
  const el = $("#kqMap"), c = coordOf(sp); if (!el || !c || !window.L) { const b = el && el.closest(".kq-map"); if (b && !window.L) b.classList.add("nomap"); return; }
  const ll = L.latLng(c.lat ?? c[0], c.lng ?? c.lon ?? c[1]);
  const bounds = L.latLngBounds([[34.94, 135.67], [35.06, 135.83]]).extend(ll);
  kmap = L.map(el, { zoomControl: false, attributionControl: false, dragging: false, touchZoom: false, doubleClickZoom: false, scrollWheelZoom: false, boxZoom: false, keyboard: false, tap: false, zoomSnap: .25 });
  addBaseTiles(kmap, el.closest(".kq-map"));
  kmap.fitBounds(bounds.pad(.04));
  const far = !L.latLngBounds([[34.92, 135.64], [35.08, 135.86]]).contains(ll);
  K_MARKS.forEach(([n, m]) => { if (ll.distanceTo(m) < 900) return; L.circleMarker(m, { radius: 2.5, weight: 0, fillColor: "#8C8C88", fillOpacity: 1, interactive: false }).addTo(kmap).bindTooltip(n, { permanent: true, direction: "right", offset: [4, 0], className: "kq-mark" }); });
  L.circleMarker(ll, { radius: 7, weight: 2, color: "#0D0D0D", fillColor: "#FFFFFF", fillOpacity: 1, interactive: false }).addTo(kmap).bindTooltip(shortName(sp), { permanent: true, direction: far ? "left" : "right", offset: far ? [-8, 0] : [8, 0], className: "kq-here" });
}
$("#viewBody").addEventListener("click", e => {
  if (viewKind !== "kentei") return;
  const st = e.target.closest("[data-kstart]"); if (st) { kStart(st.dataset.kstart); return; }
  const pk = e.target.closest("[data-kpick]");
  if (pk && kcur && kcur.pick === null) {
    const q = kById(kcur.id), j = +pk.dataset.kpick, ok = kcur.ch[j] === kRight(q);
    kcur.pick = j;
    const r = kst[q.id] || { n: 0, ok: 0, box: 0 };
    r.n++; if (ok) r.ok++; r.last = ok ? 1 : 0;
    r.box = ok ? Math.min((r.box || 0) + 1, K_INT.length - 1) : 0;
    r.due = Date.now() + (ok ? K_INT[r.box] * 864e5 : 10 * 60e3);
    kst[q.id] = r; kSave();
    klog.push({ f: q.f, ok: ok ? 1 : 0, t: Date.now() }); if (klog.length > 800) klog = klog.slice(-800);
    try { localStorage.setItem(KL_KEY, JSON.stringify(klog)); } catch (e) {}
    const td = kToday(); td.n++;
    const rank0 = kRankOf(kGot() - (kLearned(q) ? 1 : 0));
    kround.push(ok ? 1 : 0); kSaveRound();
    let done = null;
    if (kround.length >= 10) { done = kround.filter(Boolean).length; td.r = (td.r || 0) + 1; if (done >= 7) td.w = (td.w || 0) + 1; }
    kcur.g = { done, up: kRankOf(kGot()) > rank0 ? kRankOf(kGot()) : 0 };
    kSaveGame(); kSaveNow();
    try { if (navigator.vibrate) navigator.vibrate(ok ? 12 : [30, 40, 30]); } catch (e) {}
    renderKentei();
    const a = $(".kq-ans"); if (a && a.scrollIntoView) a.scrollIntoView({ block: "nearest", behavior: "smooth" });
    return;
  }
  if (e.target.closest("[data-kflag]") && kcur) {
    const i = kflag.indexOf(kcur.id); if (i < 0) kflag.push(kcur.id); else kflag.splice(i, 1);
    kSaveFlag(); renderKentei(); return;
  }
  if (e.target.closest("[data-kflagsend]")) {
    const txt = "いまいちな問題\n" + kflag.map(id => { const q = kById(id); return q ? `${id}｜${q.q}｜${kRight(q)}` : id; }).join("\n");
    const done = () => { const b = e.target.closest("[data-kflagsend]"); if (b) b.querySelector(".kp").textContent = "コピーしました"; };
    if (navigator.share) navigator.share({ text: txt }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, () => {});
    return;
  }
  const nb = e.target.closest("[data-knext]");
  if (nb && kcur) {
    const t = nb.dataset.knext, from = kById(kcur.id);
    const n = t ? kPick(from, t) : (kcur.next && kById(kcur.next) ? { q: kById(kcur.next), via: kcur.nextVia } : kPick(from));
    kRoundNext(); kServe(n.q, n.via); renderKentei(); $("#viewBody").scrollTop = 0; return;
  }
});
$("#viewNav").addEventListener("click", e => {
  if (viewKind !== "kentei") return;
  if (e.target.closest("[data-khome]")) { kHomeOpen = true; renderKentei(); $("#viewBody").scrollTop = 0; }
  if (e.target.closest("[data-kback]")) { kHomeOpen = false; renderKentei(); $("#viewBody").scrollTop = 0; }
});
// 詳細の中：この場所に問題があれば、そこから解き始められる
function kenteiSecEl(s) {
  const n = kPoolOf("spot:" + s.id).length; if (!n) return null;
  const el = document.createElement("button");
  el.type = "button"; el.className = "kq-go"; el.dataset.kspot = s.id;
  el.innerHTML = `<span>この場所の問題を解く</span><small>${n}問</small><span class="kgo">→</span>`;
  return el;
}
$("#sheetRoot").addEventListener("click", e => {
  const b = e.target.closest("[data-kspot]"); if (!b) return;
  const id = b.dataset.kspot;
  closeSheet(); setMenu(false);
  openView("kentei"); kStart("spot:" + id);
});
</script>
