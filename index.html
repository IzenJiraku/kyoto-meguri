  // 九 → 八 → … → 一 → 上ル を、止めずに一続きで
  const keys = [pad(KANJI_SEQ[0][2])];
  KANJI_SEQ.slice(1).forEach(([, , g]) => keys.push(match(keys[keys.length - 1], pad(g))));
  keys.push(match(keys[keys.length - 1], KANJI_LOGO));
  const step = 140, last = 520, total = step * (keys.length - 2) + last;
  put(keys[0]);
  const t0 = performance.now() + 120;
  const f = now => {
    const t = Math.max(0, now - t0);
    let k = Math.min(keys.length - 2, Math.floor(t / step)), u;
    if (t >= step * (keys.length - 2)) { k = keys.length - 2; u = Math.min(1, (t - step * k) / last); } else u = (t - step * k) / step;
    const e = ease(u), a = keys[k], b = keys[k + 1];
    put(a.map((c, i) => c.map((v, j) => v + (b[i][j] - v) * e)));
    if (t < total) return requestAnimationFrame(f);

    ls.forEach(l => l.remove());
    requestAnimationFrame(() => { path.style.transition = ""; });
    done();
  };
  requestAnimationFrame(f);
}

// 地図の下地: Esri の濃いグレー（文字は薄く重ねる）。読めないときは国土地理院の淡色を反転

  let errs = 0;
  base.on("tileerror", () => {
    if (++errs !== 3) return;
    m.removeLayer(base); m.removeLayer(labels);
    L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", { maxZoom: 18, maxNativeZoom: 18 }).addTo(m);
    box.classList.add("gsi");
    const cr = box.querySelector(".amap-credit"); if (cr) cr.innerHTML = `地図: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>`;

const b64enc = str => { const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

    const name = k + ".jpg";

      const blob = await idbDo("readonly", st => st.get(k));
      if (!blob) continue;
      const data = (await blobToDataUrl(blob)).split(",")[1];

      if (!pr.ok) continue;
      const blob = new Blob([await pr.arrayBuffer()], { type: "image/jpeg" });

async function syncNow() {
  if (!syncCfg || !navigator.onLine) return;
  if (syncState.busy) { syncState.again = true; return; }
  syncState.busy = true; syncState.error = ""; syncStatus();
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const { data, sha } = await pullData();
      const changed = mergeRemote(data);
      const body = { app: "goban", visits, custom, kentei: kst, kgame: { pts: kgame.pts, best: kgame.best }, stamps, updatedAt: new Date().toISOString() };
      const same = JSON.stringify({ v: data.visits, c: data.custom, q: data.kentei || {}, g: (data.kgame || {}).pts || 0, s: data.stamps }) === JSON.stringify({ v: visits, c: custom, q: kst, g: kgame.pts, s: stamps });
      if (changed) { render(); renderCover(); if (openId && !document.activeElement.closest(".log")) openSheet(openId); refreshView(); }
      if (same) break;
      const put = await gh("data.json", { method: "PUT", body: JSON.stringify(Object.assign({ message: "sync " + body.updatedAt, content: b64enc(JSON.stringify(body)) }, sha ? { sha } : {})) });
      if (put.ok) break;
      if (put.status !== 409 && put.status !== 422) throw new Error("push " + put.status);
    }
    await syncPhotos();
    render(); renderCover();
    syncState.last = new Date();
  } catch (err) {
    console.error(err);
    syncState.error = /40[13]/.test(err.message) ? "鍵（トークン）かリポジトリ名が違うか、権限が足りません" : /404/.test(err.message) ? "リポジトリが見つかりません" : "同期できませんでした。電波のある所でもう一度開いてください";
  }
  syncState.busy = false; syncStatus();
  if (syncState.again) { syncState.again = false; syncSoon(); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
window.addEventListener("online", () => syncNow());

  const el = $("#syncMsg"); if (!el) return;

let nearMsgTimer = 0;
function nearNotice(t) {
  const m = $("#nearMsg"); m.textContent = t; m.classList.add("show");
  clearTimeout(nearMsgTimer); nearMsgTimer = setTimeout(() => m.classList.remove("show"), 4500);
}
$("#nearBtn").addEventListener("click", () => {
  const btn = $("#nearBtn");
  if (btn.classList.contains("seeking")) return;
  if (!navigator.geolocation) { nearNotice("この端末では現在地が使えません"); return; }
  btn.classList.add("seeking"); btn.setAttribute("aria-busy", "true");
  const done = () => { btn.classList.remove("seeking"); btn.removeAttribute("aria-busy"); };
  navigator.geolocation.getCurrentPosition(pos => {
    const at = [pos.coords.latitude, pos.coords.longitude];
    // 1.5km以内（少なければ近い順に6件、多くても30件）
    const all = allSpots().filter(s => !s.months).map(s => ({ s, c: coordOf(s) })).filter(o => o.c).map(o => ({ id: o.s.id, d: distM(at, o.c) })).sort((a, b) => a.d - b.d);
    let pick = all.filter(o => o.d <= 1500);
    if (pick.length < 6) pick = all.slice(0, 6);
    pick = pick.slice(0, 30);
    ui.near = { at, dist: new Map(pick.map(o => [o.id, o.d])) };
    done();
    render(); window.scrollTo({ top: 0 });
  }, err => {
    done();
    nearNotice(err.code === 1 ? "位置情報が許可されていません（端末の設定で許可できます）" : "現在地が分かりませんでした");
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
});

/* ---- 端末内の写真保存（IndexedDB） ---- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("kyoto-meguri", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("photos");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction("photos", mode); const st = tx.objectStore("photos");
    const out = fn(st);
    tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error);
  });
}
const localAssets = {
  async upload(blob) {
    const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await idbDo("readwrite", st => st.put(blob, id));
    blobUrls[id] = URL.createObjectURL(blob);
    return { id, url: blobUrls[id] };
  },
  async delete(id) { await idbDo("readwrite", st => st.delete(id)); if (blobUrls[id]) URL.revokeObjectURL(blobUrls[id]); delete blobUrls[id]; return { deleted: true }; },
};
async function loadPhotos() {
  const db = await idb();
  await new Promise(res => {
    const tx = db.transaction("photos", "readonly");
    const req = tx.objectStore("photos").openCursor();
    req.onsuccess = () => { const c = req.result; if (c) { blobUrls[c.key] = URL.createObjectURL(c.value); c.continue(); } };
    tx.oncomplete = res; tx.onerror = res;
  });
}

const blobToDataUrl = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
// 書き出し・読み込みの結果は画面下にしばらくだけ出す（記録の操作は MENU › EDIT から）
let bkTimer = 0;
function bkNote(t, ja) { const el = $("#bkmsg"); el.innerHTML = `<b>${esc(t)}</b>${ja ? `<small>${esc(ja)}</small>` : ""}`; el.hidden = false; clearTimeout(bkTimer); bkTimer = setTimeout(() => { el.hidden = true; }, 3200); }
$("#exportBtn").addEventListener("click", async () => {
  const photos = {};
  const db = await idb();
  await new Promise(res => {
    const tx = db.transaction("photos", "readonly");
    const req = tx.objectStore("photos").openCursor();
    const pending = [];
    req.onsuccess = () => { const c = req.result; if (c) { const k = c.key; pending.push(blobToDataUrl(c.value).then(d => { photos[k] = d; })); c.continue(); } };
    tx.oncomplete = () => Promise.all(pending).then(res);
  });
  const data = { app: "kyoto-meguri", version: 1, exportedAt: new Date().toISOString(), visits, custom, photos };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = `kyoto-meguri-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  bkNote("EXPORTED", "記録を書き出しました");
});
$("#importFile").addEventListener("change", async e => {

  try {

    if (!data || typeof data.visits !== "object") throw new Error("format");
    visits = Object.assign({}, visits, data.visits);
    custom = Object.assign({}, custom, data.custom || {});
    for (const [k, d] of Object.entries(data.photos || {})) {
      const blob = await (await fetch(d)).blob();
      await idbDo("readwrite", st => st.put(blob, k));
      blobUrls[k] = URL.createObjectURL(blob);
    }

  } catch (err) {
    console.error(err);

});

  { id: "h-sumiya", f: "history", s: "sumiya", q: "島原に残る、揚屋建築の唯一の遺構は？", c: ["角屋", "輪違屋", "一力亭", "吉田屋"], e: "揚屋は太夫や芸妓を呼んで宴を開く店。今は「もてなしの文化美術館」。" },
  { id: "h-tokaido", f: "history", s: "sanjo-ohashi", q: "東海道五十三次の終点は？", c: ["三条大橋", "五条大橋", "七条大橋", "渡月橋"], e: "江戸の日本橋から三条大橋まで。橋の擬宝珠には天正の銘が残る。" },
  { id: "h-taisei", f: "history", s: "nijojo", q: "1867年、徳川慶喜が大政奉還の意思を示した場所は？", c: ["二条城", "京都御所", "伏見城", "聚楽第"], e: "二の丸御殿の大広間に諸藩の重臣を集めて表明した。" },
  { id: "h-nijo", f: "history", s: "nijojo", q: "二条城を築いたのは？", c: ["徳川家康", "豊臣秀吉", "織田信長", "足利義満"], e: "1603年に完成。家康はここで将軍宣下の祝賀を行った。のちに家光が拡張。" },
  // ---- 寺社 ----
  { id: "t-kakezukuri", f: "temple", s: "kiyomizu", q: "清水寺の今の本堂（国宝）は、誰の寄進で再建された？", c: ["徳川家光", "豊臣秀吉", "徳川家康", "豊臣秀頼"], e: "1633年の再建。舞台は崖に欅の柱を組み上げた懸造で、釘を使わない継手で組まれている。" },
  { id: "t-otowa", f: "temple", s: "kiyomizu", q: "清水寺の山号は？", c: ["音羽山", "霊鷲山", "東山", "清水山"], e: "境内の音羽の滝にちなむ。三筋に分かれて落ちる湧き水は、寺の名の由来ともされる。" },
  { id: "t-kinkaku", f: "temple", s: "kinkaku", q: "金閣（舎利殿）の最上層「究竟頂」の様式は？", c: ["禅宗様", "寝殿造", "武家造", "書院造"], e: "1層「法水院」は寝殿造、2層「潮音洞」は武家造、3層「究竟頂」は禅宗様の仏殿造。足利義満の北山殿として造営された。" },
  { id: "t-ginkaku", f: "temple", s: "ginkaku", q: "銀閣（観音殿）の下層「心空殿」の様式は？", c: ["書院造", "寝殿造", "禅宗様", "武家造"], e: "上層「潮音閣」は禅宗様。足利義政の東山殿として造営され、銀箔は貼られていない。" },
  { id: "t-kogetsudai", f: "temple", s: "ginkaku", q: "銀閣寺の庭にある、円錐台の形に盛った白砂は？", c: ["向月台", "立砂", "銀沙灘", "砂紋"], e: "銀沙灘は波のように平らに盛った方。どちらも江戸時代に整えられたといわれる。" },
  { id: "t-ryoanji", f: "temple", s: "ryoanji", q: "龍安寺の石庭の15の石は、いくつのまとまりに分けて置かれている？", c: ["5群", "3群", "7群", "15群（すべてばらばら）"], e: "東から5・2・3・2・3と置かれる。どこから眺めても、どれか1つは隠れて見えないといわれる。" },
  { id: "t-1001", f: "temple", s: "sanjusangendo", q: "三十三間堂の中尊・千手観音坐像（国宝）を造った仏師は？", c: ["湛慶", "運慶", "快慶", "定朝"], e: "運慶の長男。82歳のときの作とされる。左右には1000体の千手観音立像が並ぶ（中尊と合わせて1001体）。" },
  { id: "t-toji-tower", f: "temple", s: "toji", q: "東寺の五重塔について正しいのは？", c: ["木造の塔として日本一の高さ", "日本最古の五重塔", "一度も焼けたことがない", "豊臣秀吉が再建した"], e: "高さ約55m。今の塔は徳川家光の寄進で1644年に再建された5代目。最古は法隆寺の五重塔。" },
  { id: "t-kukai", f: "temple", s: "toji", q: "823年、嵯峨天皇から東寺を与えられた僧は？", c: ["空海", "最澄", "法然", "親鸞"], e: "真言密教の根本道場とした。毎月21日の弘法市は空海の命日にちなむ。" },
  { id: "t-kitsune", f: "temple", s: "fushimiinari", q: "伏見稲荷大社の主祭神は？", c: ["宇迦之御魂大神", "大国主命", "素戔嗚尊", "大山咋神"], e: "稲荷山の三つの峰に神を祀ったのが始まりとされる。神の使いは狐。" },
  { id: "t-kitano", f: "temple", s: "kitano", q: "北野天満宮で、菅原道真の命日の2月25日に行われる祭りは？", c: ["梅花祭", "瑞饋祭", "御手洗祭", "献茶祭"], e: "上七軒の芸舞妓による野点がある。瑞饋祭は10月、ずいきで屋根を葺いた神輿が出る。" },
  { id: "t-ochanoyu", f: "temple", s: "kitano", q: "1587年、豊臣秀吉が北野天満宮の境内で開いた催しは？", c: ["北野大茶湯", "醍醐の花見", "禁中茶会", "聚楽第行幸"], e: "身分を問わず誰でも参加できる大茶会として告げられた。禁中茶会は1585年、聚楽第行幸は1588年。" },
  { id: "t-daigo", f: "temple", s: "daigoji", q: "1598年、豊臣秀吉が盛大な花見を催した寺は？", c: ["醍醐寺", "仁和寺", "天龍寺", "高台寺"], e: "「醍醐の花見」。その年の8月に秀吉は亡くなった。" },
  { id: "t-byodoin", f: "temple", s: "byodoin", q: "平等院を開いたのは？", c: ["藤原頼通", "藤原道長", "白河上皇", "平清盛"], e: "父・道長の別荘を寺に改めた。鳳凰堂は1053年の建立。" },
  { id: "t-10yen", f: "temple", s: "byodoin", q: "平等院鳳凰堂の扉や壁に描かれた、阿弥陀如来が迎えに来る場面の絵は？", c: ["九品来迎図", "山越阿弥陀図", "当麻曼荼羅", "二河白道図"], e: "往生する人の9つの段階ごとの来迎を描く。国宝。" },
  { id: "t-ujigami", f: "temple", s: "ujigami", q: "現存最古の神社建築とされる本殿があるのは？", c: ["宇治上神社", "下鴨神社", "上賀茂神社", "八坂神社"], e: "本殿は平安時代後期の建築。世界遺産。" },
  { id: "t-muso", f: "temple", s: "tenryuji", q: "天龍寺の開山で、庭も手がけたとされる僧は？", c: ["夢窓疎石", "春屋妙葩", "義堂周信", "絶海中津"], e: "足利尊氏が後醍醐天皇を弔うために建てた。ほかの3人は夢窓の弟子筋で、五山文学などで知られる。" },
  { id: "t-kenninji", f: "temple", s: "kenninji", q: "1202年に栄西が開き、京都最古の禅寺とされるのは？", c: ["建仁寺", "南禅寺", "東福寺", "大徳寺"], e: "栄西は茶を日本に広めたことでも知られる。" },
  { id: "t-fujin", f: "temple", s: "kenninji", q: "建仁寺に伝わる、俵屋宗達の国宝の屏風は？", c: ["風神雷神図屏風", "燕子花図屏風", "松林図屏風", "唐獅子図屏風"], e: "燕子花図は尾形光琳、松林図は長谷川等伯、唐獅子図は狩野永徳。" },
  { id: "t-goemon", f: "temple", s: "nanzenji", q: "歌舞伎で、石川五右衛門が南禅寺の三門から言う台詞は？", c: ["絶景かな、絶景かな", "知らざあ言って聞かせやしょう", "月も朧に白魚の", "問われて名乗るもおこがましいが"], e: "演目は「楼門五三桐」。ほかは「白浪五人男」や「三人吉三」の台詞。" },
  { id: "t-gozan", f: "temple", s: "nanzenji", q: "京都五山の上に置かれた、別格の寺は？", c: ["南禅寺", "天龍寺", "相国寺", "建仁寺"], e: "五山の第一位は天龍寺。南禅寺はその上の「五山之上」。" },
  { id: "t-suirokaku", f: "temple", s: "suirokaku", q: "南禅寺の境内を通る、琵琶湖疏水の赤煉瓦の水路橋は？", c: ["水路閣", "眼鏡橋", "通天橋", "インクライン"], e: "1888年完成。古代ローマの水道橋を思わせる。" },
  { id: "t-mikaeri", f: "temple", s: "eikando", q: "永観堂の本尊「みかえり阿弥陀」は、どちらを振り返っている？", c: ["左の肩越し", "右の肩越し", "真上", "足もと"], e: "遅れる永観を「永観、おそし」と振り返ったと伝わる。" },
  { id: "t-honen", f: "temple", s: "chionin", q: "知恩院の三門（国宝）を建てさせた将軍は？", c: ["徳川秀忠", "徳川家康", "徳川家光", "徳川綱吉"], e: "1621年の建立で、現存する木造の門として最大級。知恩院は法然が晩年を過ごした地で、浄土宗の総本山。" },
  { id: "t-honganji", f: "temple", s: "higashihonganji", q: "本願寺が東西に分かれるきっかけを作ったのは？", c: ["徳川家康", "豊臣秀吉", "織田信長", "足利義昭"], e: "1602年、家康が教如に寺地を与えて東本願寺ができた。どちらも浄土真宗。" },
  { id: "t-yasaka", f: "temple", s: "yasaka", q: "八坂神社の主祭神は？", c: ["素戔嗚尊", "大国主命", "天照大神", "菅原道真"], e: "「祇園さん」と呼ばれ、祇園祭はこの神社の祭礼。" },
  { id: "t-tadasu", f: "temple", s: "shimogamo", q: "下鴨神社の「糺の森」は、賀茂川とどの川の合流点にある？", c: ["高野川", "白川", "紙屋川", "桂川"], e: "合流して鴨川となる三角州に残る原生林。" },
  { id: "t-tatesuna", f: "temple", s: "kamigamo", q: "上賀茂神社の細殿の前にある、円錐形の一対の砂山は？", c: ["立砂", "向月台", "銀沙灘", "盛塩"], e: "神が降り立った神山をかたどったもの。鬼門・裏鬼門に砂をまく清めの風習のもとともいわれる。" },
  { id: "t-koke", f: "temple", s: "saihoji", q: "「苔寺」と呼ばれる寺は？", c: ["西芳寺", "三千院", "高山寺", "祇王寺"], e: "120種以上の苔に覆われた庭。拝観は事前申し込みが必要。" },
  { id: "t-choju", f: "temple", s: "kozanji", q: "「鳥獣人物戯画」を伝える寺は？", c: ["高山寺", "仁和寺", "三千院", "醍醐寺"], e: "明恵上人が再興した寺。原本は東京と京都の国立博物館に寄託されている。" },
  { id: "t-omuro", f: "temple", s: "ninnaji", q: "仁和寺の、背が低く遅咲きの桜は？", c: ["御室桜", "枝垂桜", "左近の桜", "普賢象"], e: "4月中旬ごろが見ごろ。京都の桜の締めくくりといわれる。" },
  { id: "t-shisendo", f: "temple", s: "shisendo", q: "詩仙堂を建てた文人は？", c: ["石川丈山", "本阿弥光悦", "小堀遠州", "松尾芭蕉"], e: "もとは徳川家康に仕えた武士。36人の中国の詩人の肖像を掲げた「詩仙の間」から名がついた。" },
  { id: "t-shugakuin", f: "temple", s: "shugakuin", q: "修学院離宮を造営したのは？", c: ["後水尾上皇", "八条宮智仁親王", "後陽成天皇", "霊元天皇"], e: "比叡山の麓に上・中・下の三つの離宮が並ぶ。" },
  { id: "t-katsura", f: "temple", s: "katsura", q: "桂離宮を造営したのは？", c: ["八条宮家", "有栖川宮家", "伏見宮家", "閑院宮家"], e: "智仁親王・智忠親王の二代で整えた。ブルーノ・タウトが称賛したことでも知られる。" },
  { id: "t-rikyu", f: "temple", s: "daitokuji", q: "三門に千利休の木像を置いたことが、利休切腹の一因とされる寺は？", c: ["大徳寺", "南禅寺", "妙心寺", "東福寺"], e: "三門「金毛閣」の上層は利休の寄進。一休宗純が応仁の乱のあと再興した寺でもある。" },
  { id: "t-tsutenkyo", f: "temple", s: "tofukuji", q: "東福寺で、本堂から開山堂へ渡る谷の廊下橋は？", c: ["通天橋", "臥雲橋", "偃月橋", "観月橋"], e: "通天橋・臥雲橋・偃月橋で「東福寺三名橋」。観月橋は伏見の宇治川の橋。洗玉澗の紅葉の名所。" },
  { id: "t-togetsu", f: "temple", s: "togetsukyo", q: "嵐山の「渡月橋」の名付け親とされるのは？", c: ["亀山上皇", "後醍醐天皇", "嵯峨天皇", "桓武天皇"], e: "月が橋を渡っていくようだと言ったことから、と伝わる。" },
  { id: "t-daikakuji", f: "temple", s: "daikakuji", q: "大覚寺は、もとはどの天皇の離宮だった？", c: ["嵯峨天皇", "後水尾天皇", "桓武天皇", "白河天皇"], e: "大沢池は日本最古の庭池のひとつとされる。いけばな嵯峨御流の家元でもある。" },
  { id: "t-kodaiji", f: "temple", s: "kodaiji", q: "高台寺を建てたのは？", c: ["北政所（ねね）", "淀殿", "春日局", "細川ガラシャ"], e: "豊臣秀吉の菩提を弔うため、1606年に開いた。" },
  { id: "t-myoshinji", f: "temple", s: "myoshinji", q: "妙心寺の法堂の天井に「雲龍図」を描いた絵師は？", c: ["狩野探幽", "狩野永徳", "俵屋宗達", "伊藤若冲"], e: "見る場所によって龍の目が追ってくるように見える「八方睨みの龍」。" },
  { id: "t-sanzenin", f: "temple", s: "sanzenin", q: "大原の三千院は何宗の寺？", c: ["天台宗", "真言宗", "臨済宗", "浄土宗"], e: "最澄が比叡山に建てた草庵に始まるとされる門跡寺院。" },
  // ---- 祭り・行事 ----
  { id: "f-sandai", f: "festival", q: "京都三大祭に入らないのは？", c: ["五山送り火", "葵祭", "祇園祭", "時代祭"], e: "三大祭は葵祭（5月）、祇園祭（7月）、時代祭（10月）。送り火はお盆の行事。" },
  { id: "f-aoi-day", f: "festival", s: "aoi", q: "葵祭の行列が都大路を行く日は？", c: ["5月15日", "7月17日", "10月22日", "8月16日"], e: "京都御所から下鴨神社、上賀茂神社へ。参列者は葵の葉を身につける。" },
  { id: "f-saiodai", f: "festival", s: "aoi", q: "葵祭のヒロインとして、毎年京都の女性から選ばれるのは？", c: ["斎王代", "斎宮", "花傘娘", "白拍子"], e: "かつて賀茂社に仕えた皇女「斎王」の代わり、という意味。" },
  { id: "f-gion-month", f: "festival", s: "gion-matsuri", q: "祇園祭はいつ行われる？", c: ["7月の1か月", "5月の半ば", "8月のお盆", "10月の下旬"], e: "7月1日の吉符入から31日の疫神社夏越祭まで。山鉾巡行は17日（前祭）と24日（後祭）。" },
  { id: "f-naginata", f: "festival", s: "gion-matsuri", q: "祇園祭の山鉾巡行で、毎年先頭を行く鉾は？", c: ["長刀鉾", "月鉾", "函谷鉾", "船鉾"], e: "今も生稚児が乗る唯一の鉾。稚児が太刀でしめ縄を切って巡行が始まる。" },
  { id: "f-goryoe", f: "festival", s: "gion-matsuri", q: "祇園祭の始まりとされる、869年の疫病退散の祭礼は？", c: ["祇園御霊会", "新嘗祭", "曲水の宴", "追儺"], e: "国の数にちなんで66本の矛を立てたのが始まりと伝わる。" },
  { id: "f-jidai-start", f: "festival", s: "jidai", q: "時代祭の行列が出発するのは？", c: ["京都御所", "平安神宮", "八坂神社", "下鴨神社"], e: "平安神宮の祭礼で、行列は平安神宮へ向かう。毎年10月22日。" },
  { id: "f-jidai-order", f: "festival", s: "jidai", q: "時代祭の行列の順番は？", c: ["明治から時代をさかのぼる", "平安から時代を下る", "毎年くじで決める", "身分の順"], e: "明治維新時代から始まり、最後が延暦時代（平安）。" },
  { id: "f-daimonji", f: "festival", s: "okuribi", q: "五山送り火の「大文字」が灯る山は？", c: ["如意ヶ嶽", "船岡山", "比叡山", "吉田山"], e: "通称・大文字山。8月16日の夜8時に最初に灯る。" },
  { id: "f-okuribi-5", f: "festival", s: "okuribi", q: "今の五山送り火に入っていないのは？", c: ["「い」の字", "妙法", "舟形", "鳥居形"], e: "五山は大文字・妙法・舟形・左大文字・鳥居形。「い」や「一」の字は昔あったと伝わる。" },
  { id: "f-kurama", f: "festival", s: "kurama-hi", q: "鞍馬の火祭が行われる日は？", c: ["10月22日", "8月16日", "2月3日", "12月31日"], e: "由岐神社の例祭。時代祭と同じ日の夜。" },
  { id: "f-yasurai", f: "festival", s: "yasurai", q: "今宮神社のやすらい祭で、花傘の下に入るとどうなるといわれる？", c: ["その年を病気せずに過ごせる", "恋が叶う", "商売が繁盛する", "字が上手くなる"], e: "桜の散るころに広がる疫病を鎮める祭り。京都三大奇祭のひとつ。" },
  { id: "f-miyako", f: "festival", s: "miyako-odori", q: "「都をどり」を上演する花街は？", c: ["祇園甲部", "先斗町", "上七軒", "宮川町"], e: "先斗町は鴨川をどり、上七軒は北野をどり、宮川町は京おどり。" },

  { id: "t-atago", f: "temple", q: "「火迺要慎」のお札で知られる、火伏せの神社は？", c: ["愛宕神社", "貴船神社", "松尾大社", "車折神社"], e: "京都の家の台所によく貼られている。" },
  { id: "t-kifune", f: "temple", q: "鴨川の水源に近い貴船神社の本宮に祀られる水の神は？", c: ["高龗神", "大山咋神", "宇迦之御魂大神", "罔象女神"], e: "雨を降らせ、また止める神とされる。大山咋神は松尾大社、宇迦之御魂大神は伏見稲荷大社。" },
  { id: "t-matsuo", f: "temple", q: "酒造りの神として信仰される松尾大社の祭神は？", c: ["大山咋神", "高龗神", "宇迦之御魂大神", "素戔嗚尊"], e: "秦氏が祀った。境内には全国の酒蔵から奉納された酒樽が並ぶ。" },
  { id: "t-nonomiya", f: "temple", q: "皮のついたままの「黒木鳥居」で知られる嵯峨野の神社は？", c: ["野宮神社", "車折神社", "松尾大社", "平野神社"], e: "伊勢へ向かう斎王が身を清めた場所とされ、『源氏物語』にも登場する。" },
  { id: "t-kurumazaki", f: "temple", q: "境内に「芸能神社」があり、芸能人の名の玉垣が並ぶのは？", c: ["車折神社", "野宮神社", "八坂神社", "北野天満宮"], e: "芸能・芸術の上達を願う人がお参りする。" },
  { id: "t-higurashi", f: "temple", s: "nishihonganji", q: "見飽きず日が暮れるのを忘れることから「日暮門」と呼ばれるのは？", c: ["西本願寺の唐門", "東本願寺の御影堂門", "知恩院の三門", "南禅寺の三門"], e: "桃山時代の豪華な彫刻で飾られた国宝の門。" },
  { id: "t-toshiya", f: "temple", s: "sanjusangendo", q: "江戸時代、三十三間堂の軒下で矢を射通した競技は？", c: ["通し矢", "流鏑馬", "犬追物", "笠懸"], e: "約120mの縁側を射通した数を競った。今は1月の「大的大会」に名残がある。" },
  { id: "t-daigo-tower", f: "temple", s: "daigoji", q: "京都府に残る最古の木造建築とされるのは？", c: ["醍醐寺五重塔", "東寺五重塔", "法観寺五重塔", "清水寺本堂"], e: "951年の完成。" },
  { id: "t-tofuku-sanmon", f: "temple", s: "tofukuji", q: "現存する禅寺の三門として最古とされるのは？", c: ["東福寺三門", "南禅寺三門", "大徳寺山門", "妙心寺三門"], e: "室町時代の建築で国宝。" },
  { id: "t-tsukubai", f: "temple", s: "ryoanji", q: "龍安寺のつくばいに刻まれている言葉は？", c: ["吾唯足知", "一期一会", "日日是好日", "和敬清寂"], e: "「われ、ただ足るを知る」。中央の四角い穴を「口」として4文字に読ませる。" },
  { id: "t-kamigamo-name", f: "temple", s: "kamigamo", q: "上賀茂神社の正式な名前は？", c: ["賀茂別雷神社", "賀茂御祖神社", "賀茂大社", "鴨神社"], e: "賀茂御祖神社は下鴨神社の正式名。" },
  { id: "t-jocho", f: "temple", s: "byodoin", q: "平等院鳳凰堂の阿弥陀如来坐像を造った仏師は？", c: ["定朝", "運慶", "快慶", "鞍作止利"], e: "寄木造の技法を完成させ、「定朝様」と呼ばれる優美な作風を生んだ。" },
  { id: "t-jakkoin", f: "temple", q: "平家滅亡のあと、建礼門院が余生を送った大原の寺は？", c: ["寂光院", "三千院", "宝泉院", "勝林院"], e: "『平家物語』の最後「大原御幸」の舞台。" },
  { id: "t-gioji", f: "temple", q: "平清盛の寵愛を失った白拍子が出家したと『平家物語』に描かれる、嵯峨野の寺は？", c: ["祇王寺", "寂光院", "二尊院", "常寂光寺"], e: "苔の庭で知られる小さな寺。" },
  { id: "t-adashino", f: "temple", q: "約8000体の石仏・石塔が並ぶ、嵯峨野の寺は？", c: ["化野念仏寺", "祇王寺", "二尊院", "大覚寺"], e: "8月の千灯供養では、石仏にろうそくを供える。" },
  { id: "t-kinkaku-fire", f: "temple", s: "kinkaku", q: "金閣（舎利殿）が放火で焼失したのは？", c: ["1950年", "1945年", "1868年", "1467年"], e: "1955年に再建。三島由紀夫の小説『金閣寺』の題材になった。" },
  { id: "t-rokuonji", f: "temple", s: "kinkaku", q: "金閣寺の正式な名前は？", c: ["鹿苑寺", "慈照寺", "等持院", "相国寺"], e: "慈照寺は銀閣寺の正式名。" },
  { id: "t-kimon", f: "temple", q: "京都御所の築地塀の北東の角が、凹んで欠けている所を何と呼ぶ？", c: ["猿が辻", "鬼門角", "辰巳", "蛤御門"], e: "鬼門の北東を欠いて邪気を避けた。軒下に烏帽子をかぶった猿の像がいる。" },
  // ---- 祭り・行事 ----
  { id: "f-chimaki", f: "festival", s: "gion-matsuri", q: "祇園祭で授かり、厄除けとして玄関に飾るものは？", c: ["粽", "破魔矢", "熊手", "茅の輪"], e: "食べ物ではなく、笹の葉を巻いたお守り。山鉾ごとにご利益が違う。" },
  { id: "f-hayashi", f: "festival", s: "gion-matsuri", q: "「コンチキチン」の音で知られる、祇園祭の音楽は？", c: ["祇園囃子", "天神囃子", "神田囃子", "秩父屋台囃子"], e: "鉦・笛・太鼓で奏でる。7月に入ると各町の会所で稽古が始まる。" },
  { id: "f-shinko", f: "festival", s: "gion-matsuri", q: "7月17日の夜、八坂神社の神輿が四条の御旅所へ渡る神事は？", c: ["神幸祭", "還幸祭", "宵宮祭", "例大祭"], e: "24日の還幸祭で、神輿は八坂神社へ戻る。" },
  { id: "f-nagoshi", f: "festival", q: "6月30日、神社で大きな輪をくぐって半年のけがれを祓う行事は？", c: ["夏越の祓", "年越の祓", "追儺", "御田植祭"], e: "この日に和菓子の「水無月」を食べる習わしがある。" },
  { id: "f-okuribi-why", f: "festival", s: "okuribi", q: "五山送り火は、何のための行事？", c: ["お盆に迎えた精霊を送る", "秋の豊作を祈る", "火事を防ぐ", "新年を迎える"], e: "8月16日の夜。京都では観光の「大文字焼き」とは呼ばない。" },
  { id: "f-mukaegane", f: "festival", q: "お盆の前、六道珍皇寺で精霊を迎えるために撞く鐘は？", c: ["迎え鐘", "送り鐘", "除夜の鐘", "時の鐘"], e: "8月7日〜10日の「六道まいり」。送り鐘は寺町の矢田寺。" },
  { id: "f-jidai-why", f: "festival", s: "jidai", q: "時代祭が10月22日に行われるのはなぜ？", c: ["桓武天皇が平安京に入った日だから", "平安神宮が完成した日だから", "明治天皇の誕生日だから", "葵祭のちょうど半年後だから"], e: "延暦13年（794年）10月22日に遷都した。" },
  { id: "f-kamosai", f: "festival", s: "aoi", q: "葵祭の正式な名前は？", c: ["賀茂祭", "御蔭祭", "御霊会", "祇園会"], e: "江戸時代に再興されたとき、葵の葉で飾るようになって葵祭と呼ばれるようになった。" },
  { id: "f-futaba", f: "festival", s: "aoi", q: "葵祭で飾りや髪飾りに使う葵は？", c: ["フタバアオイ", "タチアオイ", "ゼニアオイ", "トロロアオイ"], e: "ハート形の葉が2枚向き合う草。上賀茂・下鴨両社の神紋でもある。" },
  { id: "f-ushimatsuri", f: "festival", q: "京都三大奇祭のひとつで、広隆寺に伝わる祭りは？", c: ["牛祭", "火祭", "やすらい祭", "狐の嫁入り"], e: "摩多羅神が牛に乗って練り歩く。近年は休止が続いている。" },
  { id: "f-mibukyogen", f: "festival", s: "mibu", q: "壬生寺で、鉦・太鼓・笛だけで台詞なしに演じられるものは？", c: ["壬生狂言", "能", "歌舞伎", "文楽"], e: "「カンデンデン」の音から「壬生さんのカンデンデン」と親しまれる。" },
  { id: "f-hassaku", f: "festival", q: "8月1日、祇園の芸舞妓が黒紋付で師匠やお茶屋へあいさつに回る行事は？", c: ["八朔", "事始め", "始業式", "襟替え"], e: "「八朔」は旧暦8月1日のこと。日頃の感謝を伝える。" },
  { id: "f-kotohajime", f: "festival", q: "京都で正月の準備を始める「事始め」は何月何日？", c: ["12月13日", "12月1日", "12月25日", "11月15日"], e: "祇園では芸舞妓が師匠の家へ鏡餅を持ってあいさつに行く。" },
  { id: "f-baikasai", f: "festival", s: "kitano", q: "2月25日、北野天満宮の梅花祭で野点を奉仕する花街は？", c: ["上七軒", "祇園甲部", "先斗町", "宮川町"], e: "上七軒は北野天満宮のすぐ東にある。" },
  { id: "f-gokagai", f: "festival", q: "京都の「五花街」に入らないのは？", c: ["島原", "祇園東", "上七軒", "宮川町"], e: "五花街は祇園甲部・宮川町・先斗町・上七軒・祇園東。" },
  { id: "f-kamishichi", f: "festival", q: "京都で最も古い花街とされるのは？", c: ["上七軒", "祇園甲部", "先斗町", "宮川町"], e: "室町時代、北野天満宮の再建の余材で建てた7軒の茶屋が始まりと伝わる。" },
  { id: "f-kaomise", f: "festival", q: "毎年12月に南座で行われる、役者総出演の興行は？", c: ["吉例顔見世興行", "都をどり", "壬生狂言", "薪能"], e: "京都の師走の風物詩。" },
  { id: "f-maneki", f: "festival", q: "顔見世のとき、南座の正面に並ぶ役者の名前を書いた看板は？", c: ["まねき", "のれん", "千社札", "扁額"], e: "「招き」に通じる縁起物で、勘亭流の文字で書かれる。" },
  { id: "f-jizobon", f: "festival", q: "8月下旬、町内のお地蔵さんを祀り子どもたちが楽しむ行事は？", c: ["地蔵盆", "六道まいり", "千日詣り", "十三まいり"], e: "数珠まわしやお菓子配りなど、町内ごとに行う。" },
  { id: "f-jusan", f: "festival", s: "togetsukyo", q: "十三まいりの帰り、渡月橋を渡りきるまで振り返ってはいけないとされるのはなぜ？", c: ["授かった知恵を返してしまうから", "狐に化かされるから", "願いが叶わなくなるから", "川に落ちるから"], e: "数え13歳で嵐山の法輪寺に参り、虚空蔵菩薩から知恵を授かる。" },
  { id: "f-sennichi", f: "festival", q: "7月31日の夜から参ると千日分のご利益があるとされる「千日詣り」の神社は？", c: ["愛宕神社", "伏見稲荷大社", "貴船神社", "八坂神社"], e: "標高約924mの愛宕山を夜通し登る。" },
  // ---- 食・菓子 ----
  { id: "k-minazuki", f: "food", q: "6月30日の夏越の祓に食べる和菓子は？", c: ["水無月", "柏餅", "亥の子餅", "花びら餅"], e: "三角の外郎に小豆。三角は氷を表すといわれる。" },
  { id: "k-inoko", f: "food", q: "茶道の「炉開き」の頃に食べる、猪の子をかたどった菓子は？", c: ["亥の子餅", "水無月", "柏餅", "花びら餅"], e: "旧暦10月の亥の日に食べ、無病息災と子孫繁栄を願った。" },
  { id: "k-hanabira", f: "food", q: "ごぼうと白味噌餡を包み、正月の初釜で使われる菓子は？", c: ["花びら餅", "亥の子餅", "水無月", "唐板"], e: "宮中の正月行事「歯固め」に由来するといわれる。" },
  { id: "k-zoni", f: "food", q: "京都で一般的な元日の雑煮は？", c: ["白味噌に丸餅", "すまし汁に角餅", "小豆汁に丸餅", "赤味噌に角餅"], e: "頭芋（親芋）や祝大根を入れる家も多い。" },
  { id: "k-shishigatani", f: "food", q: "ひょうたんのような形をした京野菜は？", c: ["鹿ヶ谷かぼちゃ", "賀茂なす", "聖護院かぶ", "堀川ごぼう"], e: "7月25日、安楽寺の「かぼちゃ供養」で振る舞われる。" },
  { id: "k-kamonasu", f: "food", q: "丸くて大きく、田楽によく使われる京野菜は？", c: ["賀茂なす", "山科なす", "水なす", "長なす"], e: "上賀茂周辺で育てられてきた。" },
  { id: "k-shogoin", f: "food", s: "daikon-daki", q: "大根焚きなどに使われる、丸い形の京野菜の大根は？", c: ["聖護院大根", "桜島大根", "練馬大根", "三浦大根"], e: "煮崩れしにくく、甘みがある。" },
  { id: "k-horikawa", f: "food", q: "中が空洞で、詰め物をして炊く太い京野菜のごぼうは？", c: ["堀川ごぼう", "滝野川ごぼう", "新ごぼう", "若ごぼう"], e: "聚楽第の堀に捨てられたごみから育ったのが始まりと伝わる。" },
  { id: "k-imobo", f: "food", q: "海老芋と棒鱈を炊き合わせた京料理は？", c: ["いもぼう", "芋煮", "にしんなす", "おから炊き"], e: "円山公園の平野家本家が始めたとされる。" },
  { id: "k-hamo", f: "food", q: "小骨が多く「骨切り」して食べる、夏の京都を代表する魚は？", c: ["鱧", "鮎", "鯖", "ぐじ"], e: "祇園祭の頃が旬で「祭鱧」とも。" },
  { id: "k-guji", f: "food", q: "京都で「ぐじ」と呼ばれる魚は？", c: ["アマダイ", "キンメダイ", "カレイ", "タチウオ"], e: "若狭から運ばれ、若狭焼きなどにする。" },
  { id: "k-yuba", f: "food", q: "豆乳を温めてできる膜をすくい上げたものは？", c: ["湯葉", "生麩", "豆腐", "おから"], e: "精進料理に欠かせない京の食材。" },
  { id: "k-myoe", f: "food", s: "kozanji", q: "栄西から茶の種を受け、栂尾で茶を育てたと伝わる高山寺の僧は？", c: ["明恵", "道元", "夢窓疎石", "一休宗純"], e: "高山寺には「日本最古之茶園」の碑がある。" },
  // ---- 工芸・芸能 ----
  { id: "c-nishijin", f: "craft", q: "西陣で織られる、糸を先に染めてから模様を織り出す織物は？", c: ["西陣織", "京友禅", "京鹿の子絞", "丹後ちりめん"], e: "京友禅や丹後ちりめんは、白い布にあとから染める。" },
  { id: "c-yuzen", f: "craft", q: "京友禅の名の由来になった、江戸時代の扇絵師は？", c: ["宮崎友禅斎", "尾形光琳", "本阿弥光悦", "野々村仁清"], e: "知恩院の門前に住んだと伝わり、境内に友禅苑がある。" },
  { id: "c-yuzennagashi", f: "craft", q: "かつて鴨川や堀川で、染めた布の糊や余分な染料を洗い流した作業は？", c: ["友禅流し", "布ざらし", "灯籠流し", "川床"], e: "今は川の水質保全のため、工場の中で行う。" },
  { id: "c-ninsei", f: "craft", s: "ninnaji", q: "仁和寺の門前に窯を開き、色絵の陶器で知られる江戸前期の陶工は？", c: ["野々村仁清", "尾形乾山", "楽長次郎", "酒井田柿右衛門"], e: "「仁清」の名は仁和寺の「仁」と自分の名「清右衛門」から。" },
  { id: "c-raku", f: "craft", q: "千利休の求めで長次郎が始めた、轆轤を使わない焼き物は？", c: ["楽焼", "清水焼", "信楽焼", "備前焼"], e: "手でこねて形づくる。楽家は今も京都で続く。" },
  { id: "c-sansenke", f: "craft", q: "茶道の「三千家」に入らないのは？", c: ["藪内家", "表千家", "裏千家", "武者小路千家"], e: "三千家は千利休のひ孫たちに始まる。藪内家も京都の茶道の家。" },
  { id: "c-wabicha", f: "craft", q: "千利休が大成した茶の湯の様式は？", c: ["わび茶", "書院の茶", "闘茶", "大名茶"], e: "村田珠光、武野紹鴎から受け継いだ。" },
  { id: "c-noh", f: "craft", q: "足利義満の保護を受け、能を大成した父子は？", c: ["観阿弥・世阿弥", "運慶・湛慶", "狩野正信・元信", "千利休・少庵"], e: "世阿弥は能の理論書『風姿花伝』を書いた。" },
  { id: "c-okuni", f: "craft", q: "歌舞伎の始まりとされる「かぶき踊り」を京都で始めたのは？", c: ["出雲の阿国", "静御前", "小野小町", "祇王"], e: "四条河原で踊った。南座の近くに阿国の像がある。" },
  { id: "c-kanteiryu", f: "craft", q: "南座の「まねき」に使われる書体は？", c: ["勘亭流", "寄席文字", "相撲字", "明朝体"], e: "太く丸みのある文字で、客が大入りになるようにとの願いをこめる。" },
  { id: "c-ikenobo", f: "craft", q: "いけばな発祥の地とされ、池坊が守る寺は？", c: ["六角堂（頂法寺）", "大覚寺", "仁和寺", "頂妙寺"], e: "聖徳太子の創建と伝わる。境内に京都の中心を示す「へそ石」がある。" },
  { id: "c-darari", f: "craft", q: "舞妓が締める、長く垂らした帯は？", c: ["だらりの帯", "文庫結び", "お太鼓", "角出し"], e: "帯の端に置屋の紋が入る。" },
  { id: "c-erikae", f: "craft", q: "舞妓が芸妓になることを何という？", c: ["襟替え", "店出し", "引祝い", "仕込み"], e: "赤い襟から白い襟に替わる。店出しは舞妓としてのデビュー。" },
  { id: "c-kano", f: "arch", s: "nijojo", q: "二条城二の丸御殿の障壁画を主に描いた絵師の一門は？", c: ["狩野派", "土佐派", "琳派", "円山派"], e: "狩野探幽らが描いた。" },
  { id: "c-okyo", f: "arch", q: "写生を重んじ、円山派を開いた江戸中期の京都の絵師は？", c: ["円山応挙", "伊藤若冲", "与謝蕪村", "曾我蕭白"], e: "足のない幽霊の絵を描いたのは応挙が始まりともいわれる。" },
  { id: "c-jakuchu", f: "arch", s: "nishiki", q: "錦市場の青物問屋に生まれ、鶏の絵で知られる絵師は？", c: ["伊藤若冲", "円山応挙", "長沢芦雪", "池大雅"], e: "家業のかたわら描き続けた。代表作は「動植綵絵」。" },
  { id: "c-takagamine", f: "arch", q: "本阿弥光悦が徳川家康から土地を与えられ、芸術村を開いた地は？", c: ["鷹峯", "嵯峨", "岡崎", "修学院"], e: "光悦の屋敷跡は光悦寺になっている。" },
  // ---- 暮らし・ことば ----
  { id: "l-hannari", f: "life", q: "京ことばの「はんなり」の意味は？", c: ["上品で明るく華やか", "のんびりしている", "暗く沈んでいる", "せっかち"], e: "着物の色や人柄などをほめるときに使う。" },
  { id: "l-hokasu", f: "life", q: "京ことばの「ほかす」の意味は？", c: ["捨てる", "置いておく", "隠す", "干す"], e: "関西で広く使われる。" },
  { id: "l-ikezu", f: "life", q: "京ことばの「いけず」の意味は？", c: ["意地悪", "いけない", "行けない", "生け花"], e: "「いけずやわぁ」のように柔らかく使う。" },
  { id: "l-okoshiyasu", f: "life", q: "「おこしやす」の意味は？", c: ["ようこそいらっしゃいました", "また来てください", "さようなら", "いただきます"], e: "「おいでやす」より丁寧で、わざわざ来てくれた相手に使うといわれる。" },
  { id: "l-kidaore", f: "life", q: "「京の◯倒れ、大阪の食い倒れ」の◯に入るのは？", c: ["着", "飲み", "履き", "見"], e: "京都の人は着るものにお金をかける、という言い回し。" },
  { id: "l-unagi", f: "life", q: "間口が狭く奥に長い、京町家の形を何という？", c: ["うなぎの寝床", "猫の額", "蛸の足", "雀のお宿"], e: "かつて間口の広さで税がかかったため、ともいわれる。" },
  { id: "l-inuyarai", f: "life", q: "町家の表で、壁を雨や泥はねから守る竹の囲いは？", c: ["犬矢来", "虫籠窓", "ばったり床几", "格子"], e: "ゆるやかな曲線が通りに表情を与えている。" },
  { id: "l-mushiko", f: "life", q: "町家の2階にある、土を塗りこめた格子状の低い窓は？", c: ["虫籠窓", "犬矢来", "無双窓", "鎧戸"], e: "虫かごに似ていることから。" },
  { id: "l-toriniwa", f: "life", q: "町家の入口から奥まで続く、土間の通路は？", c: ["通り庭", "坪庭", "犬走り", "濡れ縁"], e: "台所（走り）もここにあり、上は吹き抜けの「火袋」。" },
  { id: "l-zushi", f: "life", q: "通り抜けられる細い道を、京都で何と呼ぶ？", c: ["図子（辻子）", "袋小路", "犬走り", "坪"], e: "一般に、行き止まりは路地（ろーじ）、通り抜けられるのが図子とされる。" },
  { id: "l-ukon", f: "history", s: "gosho", q: "京都御所の紫宸殿の前、「左近の桜」と対に植えられているのは？", c: ["右近の橘", "右近の梅", "右近の松", "右近の楓"], e: "もとは梅だったが、平安時代に桜に植え替えられた。" },
  { id: "l-kimon", f: "temple", q: "平安京の鬼門（北東）を守るとされる寺は？", c: ["延暦寺", "東寺", "清水寺", "鞍馬寺"], e: "比叡山は京都から見て北東にそびえる。" },
  // ---- 地理・通り ----
  { id: "g-butsu", f: "street", q: "「四綾仏高松万五条」の「仏」は何通？", c: ["仏光寺通", "仏具屋町通", "仏所通", "仏国寺通"], e: "四条・綾小路・仏光寺・高辻・松原・万寿寺・五条。" },
  { id: "g-tetsugaku", f: "street", q: "「哲学の道」の名の由来になった哲学者は？", c: ["西田幾多郎", "和辻哲郎", "田辺元", "九鬼周造"], e: "疏水分線沿いを思索しながら歩いたといわれる。" },
  { id: "g-katsura", f: "street", s: "togetsukyo", q: "渡月橋の下を流れる川は、橋より下流では何と呼ばれる？", c: ["桂川", "鴨川", "宇治川", "高野川"], e: "上流は保津川、渡月橋の上流あたりは大堰川とも呼ばれる。" },
  { id: "g-seta", f: "street", s: "byodoin", q: "琵琶湖から流れ出し、京都府に入ると宇治川と呼ばれる川は？", c: ["瀬田川", "桂川", "木津川", "淀川"], e: "宇治川・桂川・木津川が合流して淀川になる。" },
  { id: "g-shirakawa", f: "street", q: "祇園の巽橋が架かる川は？", c: ["白川", "高瀬川", "鴨川", "堀川"], e: "白川沿いの新橋通は、町並み保存地区になっている。" },
  { id: "g-takase", f: "street", s: "rissei", q: "高瀬川を開いた江戸初期の豪商は？", c: ["角倉了以", "茶屋四郎次郎", "淀屋常安", "河村瑞賢"], e: "伏見と京都の中心を結ぶ舟運の運河。起点に「一之船入」が残る。" },
  { id: "g-ponto", f: "street", s: "pontocho", q: "「先斗町（ぽんとちょう）」の名の由来として有力な説は？", c: ["ポルトガル語の「先」", "鴨川の鼓の音", "酒を量る単位", "開いた人の名"], e: "鴨川と高瀬川にはさまれた、細長い「先」の土地だから、という説。" }

// 2026-11-07 追加：京都検定2級の土台づくり。人物・寺社・時代のつながりを解説に入れる
KQ.push(
  // ---- 歴史（2級） ----
  { id: "h2-ukyo", f: "history", q: "慶滋保胤が『池亭記』で「人家がまばらで荒れている」と記したのは、平安京のどちら側？", c: ["右京（西側）", "左京（東側）", "北辺", "九条の南"], e: "右京は低湿地が多く早くに衰え、都の中心は左京から鴨川の東へ広がっていった。" },
  { id: "h2-raku", f: "history", q: "京都を「洛」と呼ぶのは、中国のどの都になぞらえたから？", c: ["洛陽", "長安", "開封", "南京"], e: "平安京の左京を洛陽、右京を長安と呼んだ。右京が廃れたため、都＝洛となった。「洛中」「上洛」もここから。" },
  { id: "h2-sanpitsu", f: "history", q: "平安時代初めの「三筆」は、空海・橘逸勢ともう1人は？", c: ["嵯峨天皇", "小野道風", "藤原行成", "藤原佐理"], e: "小野道風・藤原佐理・藤原行成は、平安中期の「三蹟」。嵯峨天皇は空海に東寺を与えた天皇でもある。" },
  { id: "h2-kitano-why", f: "history", s: "kitano", q: "北野天満宮が創建された目的は？", c: ["菅原道真の怨霊を鎮める", "疫病を退ける", "洪水を防ぐ", "火事を防ぐ"], e: "大宰府で亡くなった道真のたたりと恐れられた。怨霊を祀って鎮める「御霊信仰」は、祇園御霊会（祇園祭）とも根が同じ。" },
  { id: "h2-insei", f: "history", q: "1086年、上皇が政治を行う「院政」を始めたのは？", c: ["白河上皇", "後白河上皇", "鳥羽上皇", "後鳥羽上皇"], e: "白河の地（今の岡崎）に法勝寺など六勝寺を建てた。白河は鴨川の東、岡崎一帯の古い地名。" },
  { id: "h2-funyoi", f: "history", q: "白河法皇が「思いどおりにならないもの」として挙げたのは、双六の賽、山法師と何？", c: ["賀茂川の水", "比叡の風", "都の火事", "南都の僧"], e: "「天下三不如意」。山法師は比叡山延暦寺の僧兵のこと。賀茂川はたびたび氾濫した。" },
  { id: "h2-ryojin", f: "history", q: "後白河法皇が今様（当時の流行歌）を集めて編んだ書物は？", c: ["梁塵秘抄", "閑吟集", "古今和歌集", "新古今和歌集"], e: "「遊びをせんとや生まれけむ」の歌が有名。後白河は三十三間堂を建てさせた法皇でもある。" },
  { id: "h2-kiyomori-33", f: "history", s: "sanjusangendo", q: "三十三間堂を後白河上皇のために造営したのは？", c: ["平清盛", "源頼朝", "藤原頼通", "足利義満"], e: "1164年の創建。今の本堂は1266年の再建。上皇の御所「法住寺殿」の一角だった。" },
  { id: "h2-rokuhara", f: "history", q: "平家一門の屋敷が集まり、のちに六波羅探題が置かれた鴨川東岸の地は？", c: ["六波羅", "鹿ケ谷", "嵯峨", "岡崎"], e: "平家滅亡後、鎌倉幕府はこの地に六波羅探題を置いた。地名は六波羅蜜寺に由来するともいわれる。" },
  { id: "h2-shishigatani", f: "history", q: "1177年、平家打倒の密議が発覚した事件は？", c: ["鹿ケ谷の陰謀", "保元の乱", "平治の乱", "承久の乱"], e: "東山の鹿ケ谷にあった俊寛の山荘での謀議とされる。後白河法皇の近臣が処罰された。" },
  { id: "h2-tenbun", f: "history", q: "1536年、比叡山の僧兵が京都の法華宗の寺々を焼き払った事件は？", c: ["天文法華の乱", "応仁の乱", "嘉吉の乱", "山城国一揆"], e: "町衆に広まっていた法華宗の21本山がすべて焼かれ、一時京都を追われた。" },
  { id: "h2-machishu", f: "history", s: "gion-matsuri", q: "応仁の乱で途絶えた祇園祭を、1500年に復興させたのは？", c: ["町衆", "室町幕府", "延暦寺", "公家"], e: "33年ぶりの再開。以来、山鉾は各町が受け継いで今に至る。祇園祭が「町衆の祭り」と呼ばれる理由。" },
  { id: "h2-tensho", f: "history", q: "豊臣秀吉が南北の通りを新しく通し、町を細長い区画に作り替えた都市改造は？", c: ["天正の地割", "条坊制", "太閤検地", "楽市楽座"], e: "平安京以来の正方形の区画の中央に通りを通した。御土居や寺町の整備も同じ時期の秀吉の京都改造。" },
  { id: "h2-tenmei", f: "history", q: "1788年、京都の大半を焼き、御所や二条城の本丸御殿も焼けた大火は？", c: ["天明の大火", "宝永の大火", "どんどん焼け", "明暦の大火"], e: "京都史上最大の火事とされる。御所はこのあと、平安時代の様式を取り入れて再建された。" },
  { id: "h2-dondon", f: "history", s: "hamaguri", q: "禁門の変（1864年）の戦火で京都の町が焼けた火事は、俗に何と呼ばれる？", c: ["どんどん焼け", "天明の大火", "宝永の大火", "鉄砲焼け"], e: "「鉄砲焼け」とも。約2万8千戸が焼け、祇園祭の山鉾の多くも失われた。" },
  { id: "h2-seimi", f: "history", q: "明治初め、理化学の研究と教育のため京都に置かれた施設は？", c: ["舎密局", "蕃書調所", "開成所", "勧業博覧会"], e: "舎密（せいみ）はオランダ語で化学のこと。東京遷都で沈んだ京都を産業で立て直す試みの一つ。島津製作所の創業者・島津源蔵も出入りした。" },
  { id: "h2-teidai", f: "history", s: "kyodai-clock", q: "1897年に創立された、京都大学のもとになった大学は？", c: ["京都帝国大学", "第三高等学校", "同志社英学校", "京都府医学校"], e: "東京に次ぐ2番目の帝国大学。第三高等学校（三高）は今の京大総合人間学部につながる。" },
  { id: "h2-niijima", f: "history", s: "doshisha", q: "1875年、京都に同志社英学校を開いたのは？", c: ["新島襄", "福沢諭吉", "大隈重信", "津田梅子"], e: "妻の八重は会津出身で、兄・山本覚馬は京都府の近代化を支えた人物。" },
  { id: "h2-sandai", f: "history", s: "incline", q: "明治末の京都市の「三大事業」に入らないのは？", c: ["地下鉄の建設", "第二琵琶湖疏水", "上水道の整備", "道路の拡幅と市電の敷設"], e: "1912年ごろに完成。烏丸通や四条通が広げられ、市電が走った。地下鉄の開業は1981年。" },
  { id: "h2-sokui", f: "history", s: "gosho", q: "大正天皇と昭和天皇の即位礼が行われたのは？", c: ["京都御所", "皇居（宮城）", "平安神宮", "二条城"], e: "明治の皇室典範で、即位礼と大嘗祭は京都で行うと定められていた。" },
  { id: "h2-uesugi", f: "history", q: "織田信長が上杉謙信に贈ったと伝わる、狩野永徳筆の「洛中洛外図屏風」は通称何本？", c: ["上杉本", "舟木本", "町田本", "歴博甲本"], e: "国宝。戦国時代の京都の町並みや祇園祭の山鉾巡行が細かく描かれている。" },
  { id: "h2-uji10", f: "history", s: "byodoin", q: "『源氏物語』の最後の10帖は、その舞台から何と呼ばれる？", c: ["宇治十帖", "須磨十帖", "嵯峨十帖", "大原十帖"], e: "平等院のある宇治は、平安貴族の別荘地だった。宇治橋のたもとに紫式部の像がある。" },
  // ---- 寺社（2級） ----
  { id: "t2-mandala", f: "temple", s: "toji", q: "東寺の講堂で、21体の仏像を並べて密教の世界を表したものを何という？", c: ["立体曼荼羅", "両界曼荼羅", "千体仏", "五百羅漢"], e: "空海が構想した。両界曼荼羅は絵で描いた曼荼羅のこと。" },
  { id: "t2-kawarake", f: "temple", q: "高雄の神護寺で、厄除けに素焼きの小皿を谷へ投げる風習は？", c: ["かわらけ投げ", "炮烙割り", "石投げ", "皿流し"], e: "神護寺は空海が一時住んだ寺。和気清麻呂ゆかりでもある。" },
  { id: "t2-sanbi", f: "temple", s: "kozanji", q: "紅葉の名所「三尾（さんび）」に入らないのは？", c: ["嵐山", "高雄", "槇尾", "栂尾"], e: "高雄の神護寺、槇尾の西明寺、栂尾の高山寺。鳥獣人物戯画の高山寺は栂尾にある。" },
  { id: "t2-tamuramaro", f: "temple", s: "kiyomizu", q: "延鎮とともに清水寺を創建したと伝わる武将は？", c: ["坂上田村麻呂", "源頼朝", "足利尊氏", "大伴弟麻呂"], e: "清水寺の境内には、田村麻呂と戦った蝦夷の阿弖流為と母禮の碑も建つ。" },
  { id: "t2-hosso", f: "temple", s: "kiyomizu", q: "清水寺の宗派は？", c: ["北法相宗", "天台宗", "真言宗", "浄土宗"], e: "もとは奈良の興福寺と同じ法相宗。戦後に独立して北法相宗を名乗った。" },
  { id: "t2-hiunkaku", f: "temple", s: "nishihonganji", q: "金閣・銀閣とともに「京の三閣」と呼ばれる、西本願寺の建物は？", c: ["飛雲閣", "呑湖閣", "臨春閣", "傘亭"], e: "国宝。聚楽第から移したという伝えがある。" },
  { id: "t2-daito", f: "temple", s: "daitokuji", q: "大徳寺を開いた僧は？", c: ["宗峰妙超（大燈国師）", "夢窓疎石", "一休宗純", "関山慧玄"], e: "関山慧玄は宗峰妙超の弟子で、妙心寺を開いた。大徳寺と妙心寺は同じ流れ（応燈関）に属する。" },
  { id: "t2-hanazono", f: "temple", s: "myoshinji", q: "妙心寺は、どの上皇の離宮を禅寺に改めた寺？", c: ["花園上皇", "後醍醐天皇", "亀山上皇", "後宇多上皇"], e: "開山は関山慧玄。今も「花園」という地名と、花園大学が近くに残る。" },
  { id: "t2-kameyama", f: "temple", s: "nanzenji", q: "南禅寺は、もとはどの上皇の離宮だった？", c: ["亀山上皇", "花園上皇", "後醍醐天皇", "嵯峨天皇"], e: "1291年に禅寺とした。亀山上皇は嵐山の「渡月橋」を名付けたとされる人でもある。" },
  { id: "t2-tora", f: "temple", s: "nanzenji", q: "南禅寺方丈の枯山水「虎の子渡し」の作者と伝わるのは？", c: ["小堀遠州", "夢窓疎石", "相阿弥", "重森三玲"], e: "遠州は茶人で作事奉行。南禅寺塔頭・金地院の「鶴亀の庭」も遠州の作とされる。" },
  { id: "t2-suden", f: "temple", s: "nanzenji", q: "「黒衣の宰相」と呼ばれ、南禅寺金地院に住した徳川家康の側近の僧は？", c: ["以心崇伝", "南光坊天海", "沢庵宗彭", "隠元隆琦"], e: "武家諸法度や禁中並公家諸法度の起草に関わった。" },
  { id: "t2-tofuku-name", f: "temple", s: "tofukuji", q: "東福寺の名は、奈良のどの2つの寺から一字ずつ取った？", c: ["東大寺と興福寺", "東大寺と福智院", "東寺と興福寺", "唐招提寺と福寿寺"], e: "九条道家が大きな伽藍を願って名付けた。開山は円爾（聖一国師）。" },
  { id: "t2-fucha", f: "temple", q: "宇治の萬福寺に伝わる、中国風の精進料理は？", c: ["普茶料理", "卓袱料理", "懐石料理", "本膳料理"], e: "大皿を皆で取り分けて食べる。萬福寺は隠元が開いた黄檗宗の本山。" },
  { id: "t2-shobo", f: "temple", s: "daigoji", q: "醍醐寺を開いた僧は？", c: ["聖宝（理源大師）", "空海", "円珍", "良源"], e: "874年、山上に草庵を結んだのが始まり。醍醐天皇の帰依を受けて栄えた。" },
  { id: "t2-joruri", f: "temple", q: "9体の阿弥陀如来像が並ぶ、木津川市の寺は？", c: ["浄瑠璃寺", "岩船寺", "平等院", "法界寺"], e: "九体阿弥陀堂は平安時代のものが残る唯一の例。池をはさんで浄土の世界を表す配置は平等院と通じる。" },
  { id: "t2-shomyo", f: "temple", q: "大原の「魚山（ぎょざん）」で伝えられてきた、仏教の儀式音楽は？", c: ["声明", "雅楽", "今様", "謡曲"], e: "経文に節をつけて唱える。三千院や来迎院のあたりを中国の声明の聖地になぞらえて魚山と呼ぶ。" },
  { id: "t2-hoto", f: "temple", q: "延暦寺の根本中堂で、開創以来灯り続けるとされる灯は？", c: ["不滅の法灯", "常夜灯", "をけら火", "献灯"], e: "最澄が灯したと伝わる。信長の焼き討ちで一度消えたが、分けてあった立石寺（山形）の灯から戻された。" },
  { id: "t2-monzeki", f: "temple", q: "天台宗の「三門跡」に入らないのは？", c: ["仁和寺", "青蓮院", "三千院", "妙法院"], e: "門跡は皇族や貴族が住職を務めた寺。仁和寺は真言宗の門跡寺院。" },
  { id: "t2-uda", f: "temple", s: "ninnaji", q: "仁和寺を完成させ、出家後に住んで「御室」の名の由来になったのは？", c: ["宇多天皇（法皇）", "光孝天皇", "嵯峨天皇", "醍醐天皇"], e: "父・光孝天皇が着工し、宇多天皇が888年に完成させた。御室桜・御室焼（仁清）の「御室」もここから。" },
  { id: "t2-hata", f: "temple", s: "fushimiinari", q: "伏見稲荷大社の創建に関わったとされる渡来系の氏族は？", c: ["秦氏", "東漢氏", "蘇我氏", "物部氏"], e: "711年の創建と伝わる。太秦の広隆寺、嵐山の松尾大社も秦氏ゆかり。桂川の治水も秦氏の仕事とされる。" },
  { id: "t2-gionzukuri", f: "temple", s: "yasaka", q: "本殿と拝殿を一つの屋根で覆う、八坂神社独特の建築様式は？", c: ["祇園造", "流造", "権現造", "八幡造"], e: "本殿は国宝。上賀茂・下鴨の本殿は流造、北野天満宮は権現造。" },
  { id: "t2-nagare", f: "temple", s: "shimogamo", q: "上賀茂神社・下鴨神社の本殿の様式は？", c: ["流造", "祇園造", "権現造", "春日造"], e: "前の屋根が長く伸びて流れるような形。全国の神社でもっとも多い様式。" },
  { id: "t2-hideyori", f: "temple", s: "kitano", q: "1607年に北野天満宮の今の社殿を造営したのは？", c: ["豊臣秀頼", "豊臣秀吉", "徳川家康", "徳川家光"], e: "権現造（八棟造）の国宝。秀頼は方広寺の大仏殿や東寺金堂など、多くの社寺を再建した。" },
  { id: "t2-ueji", f: "temple", s: "heianjingu", q: "平安神宮の神苑や無鄰菴の庭をつくった庭師は？", c: ["七代目小川治兵衛（植治）", "小堀遠州", "重森三玲", "中根金作"], e: "琵琶湖疏水の水を引いた近代の庭を多く手がけた。" },
  { id: "t2-murinan", f: "temple", s: "incline", q: "疏水の水を引いた庭で知られる「無鄰菴」は、誰の別荘？", c: ["山縣有朋", "伊藤博文", "西園寺公望", "大隈重信"], e: "1903年、日露戦争前の方針を話し合った「無鄰菴会議」の舞台。庭は小川治兵衛。" },
  { id: "t2-mirei", f: "temple", s: "tofukuji", q: "東福寺方丈の、市松模様の苔と敷石の庭を昭和に作庭したのは？", c: ["重森三玲", "小川治兵衛", "小堀遠州", "中根金作"], e: "1939年作の「八相の庭」。古い建材を再利用して模様をつくった。" },
  { id: "t2-tojiin", f: "temple", q: "足利歴代将軍の木像を安置する、足利家の菩提寺は？", c: ["等持院", "相国寺", "天龍寺", "鹿苑寺"], e: "足利尊氏の墓がある。開山は夢窓疎石。" },
  { id: "t2-nakiryu", f: "temple", q: "手を打つと龍が鳴くように響く「鳴き龍」の天井画がある寺は？", c: ["相国寺", "妙心寺", "天龍寺", "建仁寺"], e: "法堂の「蟠龍図」、狩野光信の作。相国寺は足利義満が建てた寺で、金閣・銀閣はその山外塔頭。" },
  { id: "t2-uguisu", f: "temple", s: "nijojo", q: "二条城二の丸御殿の、歩くと鳥の鳴き声のような音がする廊下を何という？", c: ["鶯張り", "檜張り", "竹張り", "鳴き龍"], e: "床板を留める金具がこすれて鳴る。侵入者に気づくための仕掛けという説もある。" },
  { id: "t2-kenreimon", f: "temple", s: "gosho", q: "京都御所の正門で、天皇や国賓だけが通るとされる門は？", c: ["建礼門", "建春門", "宜秋門", "朔平門"], e: "南側の正面にある。葵祭や時代祭の行列はこの門の前から出発する。" },
  // ---- 祭り・行事（2級） ----
  { id: "f2-kujitori", f: "festival", s: "gion-matsuri", q: "祇園祭の山鉾巡行の順番を決める「くじ取式」が行われる場所は？", c: ["京都市役所の市会議場", "八坂神社", "四条烏丸の会所", "京都御所"], e: "7月2日。くじを引かずに順番が決まっている山鉾は「くじ取らず」と呼ばれ、長刀鉾が先頭。" },
  { id: "f2-shingi", f: "festival", s: "gion-matsuri", q: "祇園祭の鉾の屋根の上に高くそびえる柱を何という？", c: ["真木", "心柱", "御幣", "竿"], e: "鉾頭（長刀鉾なら長刀）がその先に付く。山には真木がなく、松を立てるものが多い。" },
  { id: "f2-tsujimawashi", f: "festival", s: "gion-matsuri", q: "山鉾巡行で、鉾が交差点で向きを90度変えることを何という？", c: ["辻回し", "鉾立て", "曳初め", "くじ改め"], e: "車輪の下に割竹を敷き、水をかけて滑らせる。四条河原町などが見どころ。" },
  { id: "f2-yabusame", f: "festival", s: "shimogamo", q: "葵祭の前儀として、5月3日に下鴨神社の糺の森で行われる神事は？", c: ["流鏑馬神事", "賀茂競馬", "御蔭祭", "斎王代禊の儀"], e: "馬上から的を射る。5日には上賀茂神社で賀茂競馬が行われる。" },
  { id: "f2-kurabeuma", f: "festival", s: "kamigamo", q: "5月5日、上賀茂神社で2頭の馬が速さを競う神事は？", c: ["賀茂競馬", "流鏑馬", "駈馬神事", "御蔭祭"], e: "平安時代に宮中で行われた競馬を移したもの。「くらべうま」と読む。" },
  { id: "f2-heiankosha", f: "festival", s: "jidai", q: "時代祭の行列を担う、京都市民の組織は？", c: ["平安講社", "山鉾連合会", "町衆会", "京都講"], e: "平安神宮の創建とともにつくられた。学区ごとに担当する列が決まっている。" },
  { id: "f2-ishin", f: "festival", s: "jidai", q: "時代祭の行列の先頭を行き、笛と太鼓の行進で知られる列は？", c: ["維新勤王隊列", "延暦文官参朝列", "神幸列", "江戸時代婦人列"], e: "戊辰戦争に加わった丹波の山国隊がモデル。行列は明治から平安へとさかのぼる。" },
  { id: "f2-torii", f: "festival", s: "okuribi", q: "五山送り火で、最後に点火されるのは？", c: ["鳥居形", "左大文字", "舟形", "妙法"], e: "20時の大文字から、妙法・舟形・左大文字・鳥居形と、東から西へ順に灯る。" },
  { id: "f2-myoho", f: "festival", s: "okuribi", q: "送り火の「妙法」が灯るのは、どの地域の山？", c: ["松ヶ崎", "西賀茂", "嵯峨鳥居本", "金閣寺の北"], e: "松ヶ崎の西山に「妙」、東山に「法」。西賀茂は舟形、金閣寺の北は左大文字、鳥居本は鳥居形。" },
  { id: "f2-otaimatsu", f: "festival", q: "3月15日、嵯峨の清凉寺で大きな松明を燃やし、その燃え方で米の豊凶を占う行事は？", c: ["お松明式", "鞍馬の火祭", "柱松", "左義長"], e: "釈迦の涅槃会の行事。嵯峨大念仏狂言も清凉寺に伝わる。" },
  { id: "f2-hanezu", f: "festival", q: "小野小町ゆかりで、3月末に「はねず踊り」が奉納される山科の寺は？", c: ["随心院", "勧修寺", "醍醐寺", "毘沙門堂"], e: "はねずは薄紅色の梅のこと。深草少将の百夜通いの伝説を歌う。" },
  { id: "f2-hatsukobo", f: "festival", s: "kobo-ichi", q: "その年最初の21日に開かれる東寺の市を何と呼ぶ？", c: ["初弘法", "終い弘法", "初天神", "初午"], e: "12月21日は「終い弘法」。北野天満宮の25日は初天神・終い天神。" },
  { id: "f2-shirushi", f: "festival", s: "fushimiinari", q: "2月最初の午の日の初午大祭で授かる、伏見稲荷大社の縁起物は？", c: ["しるしの杉", "粽", "破魔矢", "熊手"], e: "稲荷の神が初めて稲荷山に降りた日が、和銅4年（711年）の2月初午とされる。" },
  { id: "f2-ebisu", f: "festival", q: "1月の「十日ゑびす」で福笹を授かる、建仁寺の近くの神社は？", c: ["京都ゑびす神社", "八坂神社", "安井金比羅宮", "六波羅蜜寺"], e: "建仁寺を開いた栄西が、宋からの帰りに嵐の海で守られたゑびす神を祀ったと伝わる。" },
  { id: "f2-horoku", f: "festival", s: "mibu", q: "節分に壬生寺へ奉納し、4月の壬生狂言「炮烙割」で割られるものは？", c: ["炮烙（素焼きの皿）", "鏡餅", "瓦", "竹筒"], e: "名前と願いを書いた皿を割ることで厄が落ちるとされる。" },
  { id: "f2-inoue", f: "festival", s: "miyako-odori", q: "祇園甲部の芸舞妓が習う京舞の流派は？", c: ["井上流", "花柳流", "若柳流", "尾上流"], e: "都をどりも井上流の振付。先斗町は尾上流、宮川町は若柳流、上七軒は花柳流。" },
  { id: "f2-onoe", f: "festival", s: "pontocho", q: "先斗町の芸舞妓が習う舞の流派は？", c: ["尾上流", "井上流", "花柳流", "若柳流"], e: "鴨川をどりは尾上流。" },
  // ---- 食（2級） ----
  { id: "k2-yusoku", f: "food", q: "平安時代の宮中や公家の儀式料理に由来する京料理を何という？", c: ["有職料理", "本膳料理", "懐石料理", "普茶料理"], e: "京料理は有職料理・精進料理・懐石料理・おばんざいなどが重なってできたといわれる。" },
  { id: "k2-saikyo", f: "food", q: "魚の切り身を漬けた「西京漬」の「西京」が指すのは？", c: ["京都（西の京）", "西京区", "西本願寺", "西陣"], e: "明治に東京ができてから、京都を西京とも呼んだ。甘い白味噌の西京味噌に漬ける。" },
  { id: "k2-karaita", f: "food", q: "上御霊神社の門前で売られる、疫病除けの由来をもつ素朴な煎餅は？", c: ["唐板", "八ッ橋", "阿闍梨餅", "五色豆"], e: "平安時代の御霊会で供えた煎餅が始まりとされる。上御霊神社は応仁の乱が始まった場所。" },
  { id: "k2-sabakaido", f: "food", s: "izuu", q: "若狭からの「鯖街道」の京都側の終点とされる場所は？", c: ["出町", "三条大橋", "大原", "鞍馬"], e: "出町の商店街の入口に「鯖街道口」の碑が立つ。大原を通る若狭街道が主な道。" },
  { id: "k2-soen", f: "food", s: "ippodo", q: "宇治田原で「青製煎茶製法」を生み、煎茶を広めたのは？", c: ["永谷宗円", "明恵", "栄西", "隠元"], e: "1738年。蒸して揉み乾かす、今の煎茶のつくり方の元になった。" },
  { id: "k2-baisao", f: "food", q: "江戸時代に京都で茶を売り歩き、煎茶の普及に努めた黄檗僧は？", c: ["売茶翁（高遊外）", "隠元", "永谷宗円", "一休宗純"], e: "伊藤若冲とも親交があり、若冲は売茶翁の肖像を描いている。" },
  // ---- 工芸・芸能（2級） ----
  { id: "c2-korin", f: "arch", q: "「琳派」の名の由来になった絵師は？", c: ["尾形光琳", "本阿弥光悦", "俵屋宗達", "酒井抱一"], e: "光悦・宗達が始め、約100年後に光琳が受け継ぎ、江戸の抱一へとつながった。直接の師弟関係ではなく「私淑」でつながるのが琳派の特徴。" },
  { id: "c2-kenzan", f: "craft", q: "尾形光琳の弟で、野々村仁清に学んだ陶工は？", c: ["尾形乾山", "野々村仁清", "青木木米", "楽道入"], e: "鳴滝に窯を開いた。兄の光琳が絵付けをした器も残る。" },
  { id: "c2-tohaku", f: "arch", q: "東山七条の智積院に残る国宝「楓図」を描いた絵師は？", c: ["長谷川等伯", "狩野永徳", "海北友松", "狩野山楽"], e: "秀吉が息子・鶴松のために建てた祥雲寺の障壁画。「桜図」は等伯の子・久蔵の作。" },
  { id: "c2-yusho", f: "arch", s: "kenninji", q: "建仁寺方丈の「雲龍図」を描いた桃山時代の絵師は？", c: ["海北友松", "長谷川等伯", "狩野永徳", "俵屋宗達"], e: "武家の出身の絵師。原本は京都国立博物館に寄託され、建仁寺では複製を見られる。" },
  { id: "c2-taian", f: "craft", q: "千利休作と伝わる現存唯一の茶室、国宝「待庵」がある寺は？", c: ["妙喜庵（大山崎）", "大徳寺", "高台寺", "南禅寺"], e: "わずか二畳の茶室。にじり口を設けた草庵茶室の原点とされる。" },
  { id: "c2-gosho-ningyo", f: "craft", q: "白い肌の幼児の姿で、宮中から大名への返礼品とされた人形は？", c: ["御所人形", "嵯峨人形", "伏見人形", "市松人形"], e: "三頭身のふくよかな姿が特徴。" },
  { id: "c2-fushimi-ningyo", f: "craft", s: "fushimiinari", q: "全国の土人形のもとになったといわれる、伏見稲荷の門前で作られてきた人形は？", c: ["伏見人形", "御所人形", "嵯峨人形", "賀茂人形"], e: "稲荷山の土を使った素焼きに彩色する。初午の土産として各地へ広まった。" },
