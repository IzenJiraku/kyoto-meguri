    <form class="sheet form" id="syncForm" role="dialog" aria-modal="true" aria-labelledby="sy-title">
      <div class="body">
        <button type="button" class="close" data-act="close" aria-label="閉じる">×</button>
        <h2 id="sy-title">PCとスマホの同期</h2>
        <p class="fine">印・メモ・自分で追加した所・写真を、GitHub の非公開リポジトリに保存して、同じ設定をした端末どうしでそろえます。PCとスマホの両方で、同じリポジトリ名と鍵を入れてください。</p>
        <div class="log">
          <label for="sy-repo">リポジトリ（持ち主/名前）<input id="sy-repo" name="repo" required value="${esc(c.repo || "IzenJiraku/goban-data")}" autocomplete="off" spellcheck="false"></label>
          <label for="sy-token">鍵（トークン）<input id="sy-token" name="token" type="password" required value="${esc(c.token || "")}" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
        </div>
        <div class="actions"><button type="submit" class="btn primary">保存して同期</button>${syncCfg ? `<button type="button" class="btn" data-act="syncoff">同期をやめる</button>` : ""}</div>
        <div class="fine" id="syncMsg"></div>
      </div>
    </form>
  </div>`;
  syncStatus();
}
$("#sheetRoot").addEventListener("submit", e => {
  if (e.target.id !== "syncForm") return;
  e.preventDefault(); e.stopImmediatePropagation();
  const fd = new FormData(e.target);
  syncCfg = { repo: String(fd.get("repo")).trim().replace(/^https:\/\/github\.com\//, "").replace(/\/$/, ""), token: String(fd.get("token")).trim() };
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); } catch (err) {}
  syncNow();
}, true);
$("#sheetRoot").addEventListener("click", e => {
  if (!e.target.closest('[data-act="syncoff"]')) return;
  syncCfg = null; try { localStorage.removeItem(SYNC_KEY); } catch (err) {}
  syncState = { busy: false, again: false, last: null, error: "" }; syncStatus();
  closeSheet();
});


/* ---- 現在地の近く ---- */
const walkMin = d => Math.max(1, Math.round(d * 1.3 / 80));
// 探している間はピンが回るだけ。うまくいかない時だけ下に小さく知らせる
let nearMsgTimer = 0;
function nearNotice(t) {
  const m = $("#nearMsg"); m.textContent = t; m.classList.add("show");
  clearTimeout(nearMsgTimer); nearMsgTimer = setTimeout(() => m.classList.remove("show"), 4500);
}
$("#nearBtn").addEventListener("click", () => {
  const btn = $("#nearBtn");
  if (btn.classList.contains("seeking")) return;
  if (!navigator.geolocation) { nearNotice("この端末では現在地が使えません"); return; }
  btn.classList.add("seeking"); btn.setAttribute("aria-busy", "true");
  const done = () => { btn.classList.remove("seeking"); btn.removeAttribute("aria-busy"); };
  navigator.geolocation.getCurrentPosition(pos => {
    const at = [pos.coords.latitude, pos.coords.longitude];
    // 1.5km以内（少なければ近い順に6件、多くても30件）
    const all = allSpots().filter(s => !s.months).map(s => ({ s, c: coordOf(s) })).filter(o => o.c).map(o => ({ id: o.s.id, d: distM(at, o.c) })).sort((a, b) => a.d - b.d);
    let pick = all.filter(o => o.d <= 1500);
    if (pick.length < 6) pick = all.slice(0, 6);
    pick = pick.slice(0, 30);
    ui.near = { at, dist: new Map(pick.map(o => [o.id, o.d])) };
    done();
    render(); window.scrollTo({ top: 0 });
  }, err => {
    done();
    nearNotice(err.code === 1 ? "位置情報が許可されていません（端末の設定で許可できます）" : "現在地が分かりませんでした");
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
});

/* ---- events ---- */
$("#pills").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (!b) return; ui.filter = b.dataset.f; saveUi(); render(); renderTip(); });
$("#status").addEventListener("change", e => { ui.status = e.target.value; saveUi(); render(); });
$("#sort").addEventListener("change", e => { ui.sort = e.target.value; saveUi(); render(); });
$("#q").addEventListener("input", e => {
  ui.q = e.target.value; render();
  // 結果が少なくても一覧の頭が見えている状態を保つ
  const top = $("#cover").offsetHeight;
  if (Math.abs(window.scrollY - top) > 2) window.scrollTo({ top });
});
$("#addBtn").addEventListener("click", () => openForm(null));
$("#area").addEventListener("change", e => { ui.area = e.target.value; render(); });
$("#tip").addEventListener("click", () => { if (tipSpot) openSheet(tipSpot); });
$("#grid").addEventListener("click", e => {
  const card = e.target.closest(".pin"); if (!card || card.classList.contains("void")) return;
  const b = e.target.closest("[data-act]");
  if (b && b.dataset.act === "toggle") { e.stopPropagation(); setFlag(card.dataset.id, "done"); return; }
  if (b && b.dataset.act === "want") { e.stopPropagation(); setFlag(card.dataset.id, "want"); return; }
  openSheet(card.dataset.id);
});
$("#grid").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("pin")) { e.preventDefault(); openSheet(e.target.dataset.id); }
});
$("#sheetRoot").addEventListener("submit", e => { e.preventDefault(); saveForm(e.target); });
$("#sheetRoot").addEventListener("click", e => {
  const fb = e.target.closest("[data-facet]");
  if (fb) {
    // 他の条件は外して、この設計者・様式だけで並べる
    ui.filter = "all"; ui.area = ""; ui.status = "all"; ui.q = ""; ui.near = null;
    $("#q").value = ""; $("#hdr").classList.remove("searching");
    ui.facet = { k: fb.dataset.facet, v: fb.dataset.v };
    closeSheet(); render(); window.scrollTo({ top: 0 });
    return;
  }
  const nb = e.target.closest("[data-near]");
  if (nb) { openSheet(nb.dataset.near); const sh = $("#sheetRoot .sheet"); if (sh) sh.scrollTop = 0; return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  if (a === "close") { if (e.target === act || act.tagName === "BUTTON") closeSheet(); return; }
  if (a === "qans") { answerQuiz(Number(act.dataset.i)); return; }
  if (a === "qnext") { openQuiz(); return; }
  if (a === "qmode") { openQuiz(act.dataset.mode); return; }
  if (a === "qopen") { const id = quiz.cur.s.id; openSheet(id); return; }
  if (a === "toggle") setFlag(openId, "done");
  else if (a === "want") setFlag(openId, "want");
  else if (a === "again") setFlag(openId, "again");
  else if (a === "edit") openForm(openId);
  else if (a === "del") {
    if (!confirmDelete) { confirmDelete = true; openSheet(openId); return; }
    const id = openId, olds = myPhotos(id);
    delete custom[id]; delete visits[id];
    persist(true); closeSheet(); render();
    if (assets) olds.forEach(k => assets.delete(k).catch(() => {}));
  }
  else if (a === "rmphoto" || a === "firstphoto") {
    const list = myPhotos(openId), k = list[heroIdx];
    if (!k) return;
    const rest = list.filter(x => x !== k);
    if (a === "rmphoto") { setMyPhotos(openId, rest); heroIdx = Math.max(0, heroIdx - 1); }
    else { setMyPhotos(openId, [k].concat(rest)); heroIdx = 0; }
    persist(true); render(); openSheet(openId); renderCover();
    if (a === "rmphoto" && assets) assets.delete(k).catch(() => {});
  }
});
$("#sheetRoot").addEventListener("change", e => {
  const a = e.target.dataset.act;
  if (a === "date") {
    // 訪問日を入れたら「行った」にして、一覧のマスをすぐカラーに
    const v = Object.assign({}, visits[openId] || {}, { date: e.target.value });
    if (v.date) v.done = true;
    visits[openId] = v; persist(true); render(); refreshView();
    const t = $('#sheetRoot .marks [data-act="toggle"]'); if (t) t.setAttribute("aria-pressed", !!v.done);
  }
  if (a === "upload" && e.target.files.length) upload(openId, e.target.files);
});
$("#sheetRoot").addEventListener("input", e => {
  if (e.target.dataset.act !== "memo") return;
  visits[openId] = Object.assign({}, visits[openId] || {}, { memo: e.target.value });
  persist(false);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheetRoot").innerHTML) closeSheet(); });
render();
renderTip();

/* ---- 端末内の写真保存（IndexedDB） ---- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("kyoto-meguri", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("photos");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction("photos", mode); const st = tx.objectStore("photos");
    const out = fn(st);
    tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error);
  });
}
const localAssets = {
  async upload(blob) {
    const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await idbDo("readwrite", st => st.put(blob, id));
    blobUrls[id] = URL.createObjectURL(blob);
    return { id, url: blobUrls[id] };
  },
  async delete(id) { await idbDo("readwrite", st => st.delete(id)); if (blobUrls[id]) URL.revokeObjectURL(blobUrls[id]); delete blobUrls[id]; return { deleted: true }; },
};
async function loadPhotos() {
  const db = await idb();
  await new Promise(res => {
    const tx = db.transaction("photos", "readonly");
    const req = tx.objectStore("photos").openCursor();
    req.onsuccess = () => { const c = req.result; if (c) { blobUrls[c.key] = URL.createObjectURL(c.value); c.continue(); } };
    tx.oncomplete = res; tx.onerror = res;
  });
}

/* ---- バックアップ ---- */
const blobToDataUrl = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
$("#exportBtn").addEventListener("click", async () => {
  const photos = {};
  const db = await idb();
  await new Promise(res => {
    const tx = db.transaction("photos", "readonly");
    const req = tx.objectStore("photos").openCursor();
    const pending = [];
    req.onsuccess = () => { const c = req.result; if (c) { const k = c.key; pending.push(blobToDataUrl(c.value).then(d => { photos[k] = d; })); c.continue(); } };
    tx.oncomplete = () => Promise.all(pending).then(res);
  });
  const data = { app: "kyoto-meguri", version: 1, exportedAt: new Date().toISOString(), visits, custom, photos };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = `kyoto-meguri-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  $("#bkmsg").textContent = "書き出しました";
});
$("#importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || typeof data.visits !== "object") throw new Error("format");
    visits = Object.assign({}, visits, data.visits);
    custom = Object.assign({}, custom, data.custom || {});
    for (const [k, d] of Object.entries(data.photos || {})) {
      const blob = await (await fetch(d)).blob();
      await idbDo("readwrite", st => st.put(blob, k));
      blobUrls[k] = URL.createObjectURL(blob);
    }
    saveLocal(); render();
    $("#bkmsg").textContent = "読み込みました";
  } catch (err) {
    console.error(err);
    $("#bkmsg").textContent = "読み込めませんでした。書き出したファイルを選んでください。";
  }
  e.target.value = "";
});

(async () => {
  assets = localAssets;
  try { await loadPhotos(); } catch (e) { console.error(e); }
  renderCover();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  locateForSort(false);
  syncNow();
})();
</script>
